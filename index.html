<title>灵感工作台</title>
<style>
:root {
  --peach: #FFB5A7; --peach-light: #FFDDD9; --peach-bg: #FFF5F3;
  --mist-blue: #A8C5D6; --mist-blue-light: #D4E4ED; --mist-blue-bg: #EEF5F9;
  --lavender: #C3B1E1; --lavender-light: #E0D4F0; --lavender-bg: #F6F1FB;
  --cream: #FDFBF9;
  --text-primary: #4A4458; --text-secondary: #8B8599; --text-light: #B5B0C0;
  --green: #7BBF8A; --green-bg: #E8F5E9;
  --shadow-soft: 0 4px 20px rgba(195,177,225,0.15);
  --shadow-card: 0 2px 12px rgba(195,177,225,0.12);
  --radius-lg: 20px; --radius-md: 14px; --radius-sm: 10px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif;
  background:var(--cream);color:var(--text-primary);
  max-width:430px;margin:0 auto;min-height:100vh;
  position:relative;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
/* 性能优化：所有可滚动区域 */
.scroll-area{overflow-y:auto;-webkit-overflow-scrolling:touch;will-change:scroll-position;}
/* 所有按钮：去除点击延迟 */
button,a,.clickable{touch-action:manipulation;-webkit-user-select:none;user-select:none;}

/* 页面容器 */
.page{display:none;min-height:100vh;padding-bottom:90px;animation:fadeIn .2s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* 顶部栏 */
.top-bar{
  position:sticky;top:0;z-index:100;
  background:rgba(253,251,249,0.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  padding:calc(12px + var(--safe-top)) 16px 12px;
  display:flex;align-items:center;gap:12px;
  border-bottom:.5px solid rgba(195,177,225,0.1);
}
.menu-btn{
  width:40px;height:40px;border-radius:12px;
  background:var(--lavender-bg);border:none;
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;
  cursor:pointer;flex-shrink:0;transition:transform .15s;
}
.menu-btn:active{transform:scale(.9);}
.menu-btn span{display:block;width:18px;height:2px;background:var(--lavender);border-radius:2px;}
.top-title{font-size:18px;font-weight:700;flex:1;}
.top-action{
  width:40px;height:40px;border-radius:12px;background:var(--peach-bg);border:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  font-size:22px;color:var(--peach);transition:transform .15s;
}
.top-action:active{transform:scale(.9);}

/* 左侧抽屉 */
.drawer-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(74,68,88,.4);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s;}
.drawer-overlay.open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;left:0;bottom:0;width:280px;background:var(--cream);z-index:201;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);padding:calc(40px + var(--safe-top)) 0 20px;overflow-y:auto;box-shadow:4px 0 30px rgba(195,177,225,.2);}
.drawer.open{transform:translateX(0);}
.drawer-header{padding:0 24px 24px;border-bottom:.5px solid rgba(195,177,225,.15);margin-bottom:16px;}
.drawer-avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--peach),var(--lavender));display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;font-weight:700;margin-bottom:12px;}
.drawer-name{font-size:17px;font-weight:700;}
.drawer-sub{font-size:13px;color:var(--text-secondary);margin-top:2px;}
.drawer-section-label{padding:0 24px;font-size:12px;font-weight:600;color:var(--text-light);letter-spacing:1px;margin:16px 0 8px;}
.drawer-item{display:flex;align-items:center;gap:14px;padding:14px 24px;cursor:pointer;transition:background .15s;position:relative;}
.drawer-item:active{background:var(--lavender-bg);}
.drawer-item.active{background:var(--lavender-bg);}
.drawer-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--lavender);border-radius:0 3px 3px 0;}
.drawer-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.drawer-label{font-size:15px;font-weight:500;}

/* 底部导航 */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(253,251,249,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid rgba(195,177,225,.12);display:flex;padding:8px 0 calc(8px + var(--safe-bottom));z-index:100;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;transition:transform .15s;}
.nav-item:active{transform:scale(.92);}
.nav-icon{font-size:22px;opacity:.5;transition:all .15s;}
.nav-label{font-size:11px;color:var(--text-secondary);font-weight:500;}
.nav-item.active .nav-icon{opacity:1;transform:translateY(-2px);}
.nav-item.active .nav-label{color:var(--lavender);font-weight:600;}

/* 通用组件 */
.card{background:#fff;border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-card);transition:transform .15s;}
.card:active{transform:scale(.98);}
.section-title{font-size:17px;font-weight:700;margin:20px 16px 12px;display:flex;align-items:center;justify-content:space-between;}
.section-title .more{font-size:13px;color:var(--text-secondary);font-weight:400;cursor:pointer;}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500;}
.tag-peach{background:var(--peach-bg);color:#D4847A;}
.tag-blue{background:var(--mist-blue-bg);color:#6B9BB5;}
.tag-lavender{background:var(--lavender-bg);color:#9B7FC5;}
.tag-green{background:var(--green-bg);color:var(--green);}

/* 主页 */
.home-greeting{padding:20px 16px 8px;}
.home-greeting h1{font-size:26px;font-weight:800;line-height:1.3;}
.home-greeting p{font-size:14px;color:var(--text-secondary);margin-top:4px;}
.home-widgets{padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.widget-card{border-radius:var(--radius-lg);padding:16px;position:relative;overflow:hidden;cursor:pointer;transition:transform .15s;}
.widget-card:active{transform:scale(.96);}
.widget-card.peach{background:linear-gradient(135deg,var(--peach-light),var(--peach-bg));}
.widget-card.blue{background:linear-gradient(135deg,var(--mist-blue-light),var(--mist-blue-bg));}
.widget-card.lavender{background:linear-gradient(135deg,var(--lavender-light),var(--lavender-bg));}
.widget-icon{font-size:24px;margin-bottom:8px;}
.widget-title{font-size:13px;color:var(--text-secondary);font-weight:500;}
.widget-value{font-size:22px;font-weight:800;margin-top:2px;}
.widget-value .unit{font-size:14px;font-weight:500;color:var(--text-secondary);}
.widget-sub{font-size:12px;color:var(--text-secondary);margin-top:4px;}
.widget-trend{font-size:11px;font-weight:600;margin-top:2px;color:var(--green);}

/* 横滑列表 */
.h-scroll{display:flex;gap:10px;padding:0 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.h-scroll::-webkit-scrollbar{display:none;}
.recent-item{flex-shrink:0;width:100px;border-radius:var(--radius-md);overflow:hidden;background:#fff;box-shadow:var(--shadow-card);cursor:pointer;transition:transform .15s;}
.recent-item:active{transform:scale(.95);}
.recent-thumb{width:100px;height:100px;display:flex;align-items:center;justify-content:center;font-size:32px;}
.recent-thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
.recent-thumb{position:relative;overflow:hidden;}
.recent-info{padding:8px 10px;}
.recent-title{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.recent-tag{font-size:10px;color:var(--text-light);margin-top:2px;}

/* 灵感广场信息流 */
.insp-tabs{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;scrollbar-width:none;}
.insp-tabs::-webkit-scrollbar{display:none;}
.insp-tab{flex-shrink:0;padding:7px 16px;border-radius:20px;font-size:13px;font-weight:500;background:#fff;color:var(--text-secondary);border:1px solid rgba(195,177,225,.15);cursor:pointer;transition:all .15s;}
.insp-tab:active{transform:scale(.94);}
.insp-tab.active{background:linear-gradient(135deg,var(--peach),var(--lavender));color:#fff;border-color:transparent;}

.search-bar{margin:0 16px 12px;background:#fff;border-radius:var(--radius-md);padding:10px 14px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-card);cursor:pointer;}
.search-bar input{flex:1;border:none;outline:none;font-size:14px;background:transparent;color:var(--text-primary);}
.search-bar input::placeholder{color:var(--text-light);}
.search-bar .s-icon{font-size:16px;opacity:.5;}

.insp-feed{padding:0 16px;display:flex;flex-direction:column;gap:14px;}
.insp-card{background:#fff;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-card);transition:transform .15s;cursor:pointer;}
.insp-card:active{transform:scale(.98);}
.insp-cover{width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;font-size:48px;position:relative;}
.insp-cover.c1{background:linear-gradient(135deg,var(--peach-light),var(--peach));}
.insp-cover.c2{background:linear-gradient(135deg,var(--mist-blue-light),var(--mist-blue));}
.insp-cover.c3{background:linear-gradient(135deg,var(--lavender-light),var(--lavender));}
.insp-cover.c4{background:linear-gradient(135deg,#FFD9C4,var(--lavender));}
.insp-platform{position:absolute;top:10px;left:10px;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;color:#fff;background:rgba(0,0,0,.25);backdrop-filter:blur(10px);}
.insp-heat{position:absolute;bottom:10px;right:10px;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;color:#fff;background:rgba(0,0,0,.25);backdrop-filter:blur(10px);}
.insp-body{padding:12px 14px 14px;}
.insp-title{font-size:15px;font-weight:700;line-height:1.4;}
.insp-reason{font-size:13px;color:var(--text-secondary);margin-top:6px;line-height:1.5;background:var(--lavender-bg);padding:8px 10px;border-radius:10px;}
.insp-reason::before{content:'📝 ';}
.insp-actions{display:flex;gap:8px;margin-top:10px;}
.insp-btn{flex:1;padding:8px;border-radius:10px;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:transform .15s;}
.insp-btn:active{transform:scale(.95);}
.insp-btn-save{background:linear-gradient(135deg,var(--peach),var(--lavender));color:#fff;}
.insp-btn-detail{background:var(--cream);color:var(--text-secondary);}

/* 素材库 */
.material-toolbar{padding:12px 16px;display:flex;gap:8px;align-items:center;}
.material-search{flex:1;background:#fff;border-radius:var(--radius-md);padding:9px 14px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-card);}
.material-search input{flex:1;border:none;outline:none;font-size:14px;background:transparent;}
.material-filter-btn{width:40px;height:40px;border-radius:var(--radius-md);background:#fff;box-shadow:var(--shadow-card);border:none;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;}
.mat-tag{flex-shrink:0;padding:6px 14px;border-radius:16px;font-size:13px;font-weight:500;background:#fff;color:var(--text-secondary);border:1px solid rgba(195,177,225,.15);cursor:pointer;transition:all .15s;}
.mat-tag:active{transform:scale(.94);}
.mat-tag.active{background:var(--lavender);color:#fff;border-color:transparent;}
.material-collections{padding:0 16px 12px;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;}
.material-collections::-webkit-scrollbar{display:none;}
.collection-card{flex-shrink:0;width:120px;border-radius:var(--radius-md);padding:12px;background:linear-gradient(135deg,var(--lavender-light),var(--mist-blue-light));cursor:pointer;transition:transform .15s;}
.collection-card:active{transform:scale(.95);}
.collection-card.alt{background:linear-gradient(135deg,var(--peach-light),var(--lavender-light));}
.collection-card.alt2{background:linear-gradient(135deg,var(--mist-blue-light),var(--lavender-light));}
.collection-name{font-size:13px;font-weight:700;}
.collection-count{font-size:11px;color:var(--text-secondary);margin-top:4px;}

.waterfall{padding:0 12px;column-count:2;column-gap:10px;}
.wf-item{break-inside:avoid;margin-bottom:10px;border-radius:var(--radius-md);overflow:hidden;background:#fff;box-shadow:var(--shadow-card);cursor:pointer;transition:transform .15s;}
.wf-item:active{transform:scale(.97);}
.wf-thumb{width:100%;display:flex;align-items:center;justify-content:center;font-size:36px;position:relative;}
.wf-thumb.h1{height:140px;background:linear-gradient(135deg,var(--peach-light),var(--peach));}
.wf-thumb.h2{height:180px;background:linear-gradient(135deg,var(--mist-blue-light),var(--mist-blue));}
.wf-thumb.h3{height:110px;background:linear-gradient(135deg,var(--lavender-light),var(--lavender));}
.wf-thumb.h4{height:160px;background:linear-gradient(135deg,#FFD9C4,var(--lavender));}
.wf-type-badge{position:absolute;top:6px;right:6px;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;color:#fff;background:rgba(0,0,0,.3);backdrop-filter:blur(10px);}
.wf-info{padding:8px 10px 10px;}
.wf-title{font-size:12px;font-weight:600;line-height:1.3;}
.wf-tags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap;}
.wf-mini-tag{font-size:10px;padding:1px 7px;border-radius:8px;background:var(--lavender-bg);color:var(--lavender);}

/* FAB */
.fab{position:fixed;bottom:80px;right:16px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--peach),var(--lavender));border:4px solid var(--cream);box-shadow:var(--shadow-soft);display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;cursor:pointer;z-index:90;transition:transform .15s;}
.fab:active{transform:scale(.88);}

/* 笔记 */
.folder-chip{flex-shrink:0;padding:8px 16px;border-radius:14px;background:#fff;box-shadow:var(--shadow-card);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:transform .15s;}
.folder-chip:active{transform:scale(.94);}
.folder-chip.active{background:linear-gradient(135deg,var(--lavender),var(--mist-blue));color:#fff;}
.note-list{padding:0 16px;display:flex;flex-direction:column;gap:12px;}
.note-card{background:#fff;border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-card);cursor:pointer;transition:transform .15s;}
.note-card:active{transform:scale(.98);}
.note-card.short{border-left:3px solid var(--peach);}
.note-card.long{border-left:3px solid var(--mist-blue);}
.note-type{font-size:11px;font-weight:600;color:var(--text-light);margin-bottom:6px;}
.note-title{font-size:15px;font-weight:700;margin-bottom:6px;}
.note-preview{font-size:13px;color:var(--text-secondary);line-height:1.5;white-space:pre-wrap;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;}
.note-footer{display:flex;gap:8px;margin-top:10px;align-items:center;}
.note-date{font-size:11px;color:var(--text-light);flex:1;}

/* 阅读 */
.reading-stats{margin:0 16px 16px;background:linear-gradient(135deg,var(--lavender-light),var(--mist-blue-light));border-radius:var(--radius-lg);padding:18px;display:flex;align-items:center;gap:16px;}
.reading-stat-main{flex:1;}
.reading-stat-label{font-size:13px;color:var(--text-secondary);font-weight:500;}
.reading-stat-num{font-size:32px;font-weight:800;}
.reading-stat-unit{font-size:14px;font-weight:500;color:var(--text-secondary);}
.reading-stat-compare{text-align:center;padding-left:16px;border-left:1px solid rgba(255,255,255,.5);}
.reading-stat-compare .label{font-size:11px;color:var(--text-secondary);}
.reading-stat-compare .num{font-size:18px;font-weight:700;}
.reading-stat-trend{font-size:12px;font-weight:600;color:var(--green);margin-top:2px;}
.book-shelf{padding:0 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.book-card{cursor:pointer;transition:transform .15s;}
.book-card:active{transform:scale(.95);}
.book-cover{width:100%;aspect-ratio:3/4;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:var(--shadow-card);}
.book-info{margin-top:6px;}
.book-title{font-size:12px;font-weight:600;line-height:1.3;}
.book-author{font-size:10px;color:var(--text-light);margin-top:2px;}
.book-status{display:inline-block;margin-top:3px;font-size:9px;padding:1px 6px;border-radius:6px;font-weight:600;}
.status-reading{background:var(--peach-bg);color:#D4847A;}
.status-done{background:var(--green-bg);color:var(--green);}
.status-want{background:var(--lavender-bg);color:#9B7FC5;}

/* 阅读收获样式 */
.note-takeaway{font-size:13px;color:var(--text-secondary);margin-top:8px;padding:6px 10px;background:var(--peach-bg);border-radius:8px;line-height:1.5;}

/* === 书籍封面上传裁剪 === */
.cover-upload-area{text-align:center;padding:8px 0;}
.cover-crop-frame{width:140px;height:140px;margin:0 auto;border-radius:10px;overflow:hidden;position:relative;background:#fff;box-shadow:var(--shadow-card);cursor:pointer;border:2px dashed var(--lavender-light);}
.cover-crop-frame.has-image{border-style:solid;border-color:var(--lavender);}
.cover-crop-inner{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none;}
.cover-crop-inner img{width:100%;height:auto;}
.cover-upload-placeholder{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:36px;opacity:.6;color:var(--lavender);}
.cover-zoom-control{margin-top:8px;display:flex;align-items:center;gap:10px;justify-content:center;}
.cover-zoom-control input[type=range]{width:120px;accent-color:var(--lavender);}
.cover-hint{font-size:11px;color:var(--text-light);margin-top:2px;}
/* 标签筛选行与下方内容间距 */
.h-scroll{margin-bottom:6px;}
.insp-tabs{margin-bottom:8px;}
.note-folder-scroll + .section-title{margin-top:12px;}
.material-collections + .section-title{margin-top:16px;}
.book-shelf{margin-top:12px;}
/* 书籍封面图片 */
.book-cover img{width:100%;height:100%;object-fit:cover;border-radius:8px;}

/* 素材上传区域 */
.mat-upload-area{background:#fff;border-radius:var(--radius-md);border:2px dashed var(--lavender-light);padding:14px;cursor:pointer;text-align:center;transition:border-color .15s;}
.mat-upload-area:active{border-color:var(--lavender);}
.mat-upload-preview{position:relative;min-height:90px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.mat-upload-preview img{max-width:100%;max-height:220px;border-radius:8px;object-fit:contain;}
.mat-upload-preview video{max-width:100%;max-height:220px;border-radius:8px;}
.mat-upload-placeholder{font-size:14px;color:var(--text-light);padding:20px 10px;}
.mat-upload-file-name{font-size:12px;color:var(--text-secondary);margin-top:6px;word-break:break-all;}
/* 素材卡片图片显示 */
.insp-cover{overflow:hidden;}
.insp-cover img,.wf-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.wf-thumb{overflow:hidden;}
.detail-cover img{width:100%;height:100%;object-fit:cover;}

/* 弹层 */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(74,68,88,.5);z-index:300;opacity:0;pointer-events:none;transition:opacity .3s;display:flex;align-items:flex-end;justify-content:center;}
.modal-overlay.open{opacity:1;pointer-events:auto;}
.modal-sheet{background:var(--cream);border-radius:24px 24px 0 0;width:100%;max-width:430px;padding:20px 20px calc(30px + var(--safe-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.modal-overlay.open .modal-sheet{transform:translateY(0);}
.modal-handle{width:36px;height:4px;background:var(--lavender-light);border-radius:2px;margin:0 auto 16px;}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px;text-align:center;}
.save-source-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.source-option{background:#fff;border-radius:var(--radius-md);padding:18px 12px;text-align:center;cursor:pointer;transition:transform .15s;box-shadow:var(--shadow-card);}
.source-option:active{transform:scale(.95);}
.source-icon{font-size:32px;margin-bottom:6px;}
.source-label{font-size:13px;font-weight:600;}
.form-group{margin-bottom:14px;}
.form-label{font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;display:block;}
.form-input,.form-textarea{width:100%;background:#fff;border:1px solid rgba(195,177,225,.2);border-radius:var(--radius-sm);padding:12px 14px;font-size:14px;color:var(--text-primary);outline:none;font-family:inherit;transition:border .15s;}
.form-input:focus,.form-textarea:focus{border-color:var(--lavender);}
.form-textarea{min-height:70px;resize:none;}
.tag-input-area{background:#fff;border:1px solid rgba(195,177,225,.2);border-radius:var(--radius-sm);padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:46px;}
.tag-input-area input{flex:1;min-width:60px;border:none;outline:none;font-size:13px;background:transparent;}
.tag-pill{display:flex;align-items:center;gap:4px;padding:3px 10px;background:var(--lavender-bg);color:var(--lavender);border-radius:12px;font-size:12px;font-weight:500;}
.tag-pill .remove{cursor:pointer;font-size:14px;line-height:1;}
.btn-primary{width:100%;padding:14px;border-radius:var(--radius-md);background:linear-gradient(135deg,var(--peach),var(--lavender));color:#fff;font-size:15px;font-weight:700;border:none;cursor:pointer;transition:transform .15s;}
.btn-primary:active{transform:scale(.97);}
.btn-secondary{width:100%;padding:14px;border-radius:var(--radius-md);background:#fff;color:var(--text-secondary);font-size:15px;font-weight:600;border:1px solid rgba(195,177,225,.2);cursor:pointer;margin-top:8px;}
.btn-danger{width:100%;padding:14px;border-radius:var(--radius-md);background:#fff;color:#E07070;font-size:15px;font-weight:600;border:1px solid rgba(224,112,112,.2);cursor:pointer;margin-top:8px;}

.detail-cover{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:64px;position:relative;overflow:hidden;}

.detail-label{font-size:12px;font-weight:600;color:var(--text-light);margin-bottom:8px;}
.detail-content{font-size:14px;color:var(--text-primary);line-height:1.6;white-space:pre-wrap;}
.bgm-player{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--lavender-bg),var(--mist-blue-bg));border-radius:var(--radius-md);padding:12px 14px;}

.bgm-info{flex:1;min-width:0;}
.bgm-title{font-size:14px;font-weight:600;}
.bgm-source{font-size:12px;color:var(--text-secondary);margin-top:2px;}
.bgm-play{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;flex-shrink:0;box-shadow:var(--shadow-card);transition:transform .15s;}
.bgm-play:active{transform:scale(.88);}
.link-jump-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;background:var(--mist-blue-bg);border-radius:var(--radius-sm);font-size:14px;font-weight:600;color:#6B9BB5;cursor:pointer;}

/* 筛选chip */
.filter-chip{flex-shrink:0;padding:6px 14px;border-radius:16px;font-size:12px;font-weight:600;background:#fff;color:var(--text-secondary);border:1px solid rgba(195,177,225,.15);cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .15s;}
.filter-chip:active{transform:scale(.94);}
.filter-chip.active{background:var(--lavender-bg);color:var(--lavender);border-color:var(--lavender);}

/* 待办 */
.todo-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fff;border-radius:var(--radius-md);margin-bottom:8px;box-shadow:var(--shadow-card);cursor:pointer;transition:transform .15s;}

.todo-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--lavender-light);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;}
.todo-check.done{background:var(--lavender);border-color:var(--lavender);color:#fff;font-size:12px;}
.todo-text{flex:1;font-size:14px;font-weight:500;}
.todo-item.done .todo-text{color:var(--text-light);text-decoration:line-through;}
.todo-time{font-size:12px;color:var(--text-light);}

/* 日程 */
.schedule-item{display:flex;gap:12px;padding:0 16px;margin-bottom:12px;}
.schedule-time{width:50px;text-align:right;font-size:13px;font-weight:700;color:var(--text-secondary);padding-top:2px;flex-shrink:0;}
.schedule-card{flex:1;background:#fff;border-radius:var(--radius-md);padding:12px 14px;box-shadow:var(--shadow-card);border-left:3px solid var(--peach);}
.schedule-card.blue{border-left-color:var(--mist-blue);}
.schedule-card.lavender{border-left-color:var(--lavender);}
.schedule-title{font-size:14px;font-weight:600;}
.schedule-desc{font-size:12px;color:var(--text-secondary);margin-top:4px;}

/* 编辑器 */
.editor-bar{position:sticky;top:0;z-index:100;background:rgba(253,251,249,.92);backdrop-filter:blur(20px);padding:calc(12px + var(--safe-top)) 16px 12px;display:flex;align-items:center;gap:12px;border-bottom:.5px solid rgba(195,177,225,.1);}
.editor-title-input{flex:1;font-size:18px;font-weight:700;border:none;outline:none;background:transparent;color:var(--text-primary);}
.editor-body{padding:16px;}
.editor-content-input{width:100%;min-height:300px;border:none;outline:none;font-size:15px;line-height:1.7;color:var(--text-primary);background:transparent;font-family:inherit;resize:none;}

/* 空状态 */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-light);}
.empty-state-icon{font-size:48px;margin-bottom:12px;}
.empty-state-text{font-size:14px;}

/* Toast */
.toast{position:fixed;top:calc(60px + var(--safe-top));left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(74,68,88,.9);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:all .3s;pointer-events:none;max-width:90%;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* 安装引导 */
.install-banner{position:fixed;bottom:90px;left:16px;right:16px;max-width:398px;margin:0 auto;background:linear-gradient(135deg,var(--peach),var(--lavender));border-radius:var(--radius-lg);padding:14px 16px;display:flex;align-items:center;gap:12px;z-index:95;box-shadow:var(--shadow-soft);transition:transform .3s,opacity .3s;}
.install-banner.hide{transform:translateY(100px);opacity:0;pointer-events:none;}
.install-banner-text{flex:1;color:#fff;}
.install-banner-title{font-size:14px;font-weight:700;}
.install-banner-sub{font-size:12px;opacity:.9;margin-top:2px;}
.install-banner-btn{padding:8px 16px;background:#fff;color:var(--lavender);border-radius:10px;font-size:13px;font-weight:700;border:none;cursor:pointer;}
.install-banner-close{color:#fff;font-size:20px;cursor:pointer;opacity:.7;}
</style>
</head>

<script>
/**
 * db.js — 数据层
 * 基于 IndexedDB 封装，支持增删改查、备份导出、导入恢复
 */

const DB_NAME = 'InspirationWorkbench';
const DB_VERSION = 1;

// 数据表定义
const STORES = {
  materials: { keyPath: 'id', indexes: [
    { name: 'type', keyPath: 'type' },
    { name: 'collectionId', keyPath: 'collectionId' },
    { name: 'createdAt', keyPath: 'createdAt' },
    { name: 'tags', keyPath: 'tags', options: { multiEntry: true } }
  ]},
  collections: { keyPath: 'id', indexes: [
    { name: 'createdAt', keyPath: 'createdAt' }
  ]},
  notes: { keyPath: 'id', indexes: [
    { name: 'folderId', keyPath: 'folderId' },
    { name: 'type', keyPath: 'type' },
    { name: 'createdAt', keyPath: 'createdAt' }
  ]},
  folders: { keyPath: 'id', indexes: [
    { name: 'createdAt', keyPath: 'createdAt' }
  ]},
  books: { keyPath: 'id', indexes: [
    { name: 'category', keyPath: 'category' },
    { name: 'status', keyPath: 'status' },
    { name: 'createdAt', keyPath: 'createdAt' }
  ]},
  excerpts: { keyPath: 'id', indexes: [
    { name: 'bookId', keyPath: 'bookId' },
    { name: 'createdAt', keyPath: 'createdAt' }
  ]},
  todos: { keyPath: 'id', indexes: [
    { name: 'date', keyPath: 'date' },
    { name: 'done', keyPath: 'done' }
  ]},
  schedules: { keyPath: 'id', indexes: [
    { name: 'date', keyPath: 'date' }
  ]}
};

let db = null;

// 打开/初始化数据库
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onerror = () => reject(req.error);
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onupgradeneeded = (e) => {
      const database = e.target.result;
      for (const [storeName, config] of Object.entries(STORES)) {
        if (!database.objectStoreNames.contains(storeName)) {
          const store = database.createObjectStore(storeName, { keyPath: config.keyPath });
          if (config.indexes) {
            config.indexes.forEach(idx => {
              store.createIndex(idx.name, idx.keyPath, idx.options || {});
            });
          }
        }
      }
    };
  });
}

// 通用：获取事务
function getTx(storeName, mode = 'readonly') {
  const tx = db.transaction(storeName, mode);
  return tx.objectStore(storeName);
}

// 生成唯一ID
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 9);
}

// ===== 通用 CRUD =====
const DB = {
  async add(storeName, data) {
    if (!data.id) data.id = uid();
    if (!data.createdAt) data.createdAt = Date.now();
    return new Promise((resolve, reject) => {
      const store = getTx(storeName, 'readwrite');
      const req = store.add(data);
      req.onsuccess = () => resolve(data);
      req.onerror = () => reject(req.error);
    });
  },

  async put(storeName, data) {
    if (data.createdAt && !data.updatedAt) data.updatedAt = Date.now();
    return new Promise((resolve, reject) => {
      const store = getTx(storeName, 'readwrite');
      const req = store.put(data);
      req.onsuccess = () => resolve(data);
      req.onerror = () => reject(req.error);
    });
  },

  async get(storeName, id) {
    return new Promise((resolve, reject) => {
      const store = getTx(storeName);
      const req = store.get(id);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },

  async getAll(storeName) {
    return new Promise((resolve, reject) => {
      const store = getTx(storeName);
      const req = store.getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  },

  async delete(storeName, id) {
    return new Promise((resolve, reject) => {
      const store = getTx(storeName, 'readwrite');
      const req = store.delete(id);
      req.onsuccess = () => resolve(true);
      req.onerror = () => reject(req.error);
    });
  },

  async clear(storeName) {
    return new Promise((resolve, reject) => {
      const store = getTx(storeName, 'readwrite');
      const req = store.clear();
      req.onsuccess = () => resolve(true);
      req.onerror = () => reject(req.error);
    });
  },

  // 按索引查询
  async getByIndex(storeName, indexName, value) {
    return new Promise((resolve, reject) => {
      const store = getTx(storeName);
      const index = store.index(indexName);
      const req = index.getAll(value);
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  },

  // 按游标范围查询（用于按时间排序）
  async getByRange(storeName, indexName, lower, upper) {
    return new Promise((resolve, reject) => {
      const store = getTx(storeName);
      const index = store.index(indexName);
      const range = (lower !== undefined && upper !== undefined)
        ? IDBKeyRange.bound(lower, upper)
        : (lower !== undefined ? IDBKeyRange.lowerBound(lower) : IDBKeyRange.upperBound(upper));
      const req = index.getAll(range);
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  },

  uid,
  STORES,

  // ===== 备份导出 =====
  async exportAll() {
    const data = {};
    for (const storeName of Object.keys(STORES)) {
      data[storeName] = await this.getAll(storeName);
    }
    return {
      version: DB_VERSION,
      exportDate: new Date().toISOString(),
      data
    };
  },

  // ===== 导入恢复 =====
  async importAll(backup) {
    if (!backup || !backup.data) throw new Error('备份文件格式错误');
    for (const storeName of Object.keys(STORES)) {
      await this.clear(storeName);
      const items = backup.data[storeName] || [];
      for (const item of items) {
        await this.add(storeName, item);
      }
    }
    return true;
  },

  // ===== 预置示例数据 =====
  async seedIfEmpty() {
    // 如果用户曾经清空过数据，永不再注入示例数据
    if (localStorage.getItem('dataCleared') === '1') return false;

    for (const storeName of Object.keys(STORES)) {
      const items = await this.getAll(storeName);
      if (items.length > 0) return false;
    }

    const now = Date.now();
    const day = 86400000;

    // 合集
    const col1 = await this.add('collections', { name: '拍摄参考', icon: '📷' });
    const col2 = await this.add('collections', { name: 'BGM收藏', icon: '🎵' });
    const col3 = await this.add('collections', { name: '美妆灵感', icon: '💄' });

    // 素材
    const sampleMaterials = [
      { type: 'bgm', title: '复古爵士BGM｜适合慢节奏Vlog', note: '节奏舒缓，副歌在第45秒，可卡点转场。咖啡馆探店可用。', tags: ['BGM','复古'], collectionId: col2.id, sourceUrl: 'https://music.163.com/song?id=example', sourcePlatform: '网易云', cover: '🎵', createdAt: now - 3600000 },
      { type: 'image', title: '法式穿搭参考｜雾霾蓝配色方案', note: '配色与工作台风格一致，可做系列穿搭内容。', tags: ['穿搭','复古'], collectionId: col1.id, sourceUrl: 'https://www.xiaohongshu.com/explore/example', sourcePlatform: '小红书', cover: '👗', createdAt: now - 7200000 },
      { type: 'video', title: '变装卡点转场｜复古到现代', note: 'BGM节奏感强，跟拍门槛低，本周热度上升320%。', tags: ['转场','变装'], collectionId: col1.id, sourceUrl: 'https://www.douyin.com/video/example', sourcePlatform: '抖音', cover: '🎬', createdAt: now - 10800000 },
      { type: 'image', title: '蜜桃妆容参考｜粉紫色调', note: '粉紫配色，适合自拍跟拍，评论区互动率高。', tags: ['美妆','粉紫'], collectionId: col3.id, sourceUrl: 'https://www.xiaohongshu.com/explore/example2', sourcePlatform: '小红书', cover: '💄', createdAt: now - 14400000 },
      { type: 'link', title: '小红书探店笔记｜复古咖啡馆', note: '老城区咖啡馆，光线适合拍摄，下午3-5点最佳。', tags: ['探店','复古'], collectionId: col1.id, sourceUrl: 'https://www.xiaohongshu.com/explore/example3', sourcePlatform: '小红书', cover: '📷', createdAt: now - 18000000 },
      { type: 'image', title: '紫色系调色参考', note: '灰紫主色+雾蓝辅色，高光用奶油白。', tags: ['调色','粉紫'], collectionId: null, sourceUrl: '', sourcePlatform: '', cover: '✨', createdAt: now - 21600000 },
    ];
    for (const m of sampleMaterials) await this.add('materials', m);

    // 文件夹
    const f1 = await this.add('folders', { name: '创意灵感', icon: '💡' });
    const f2 = await this.add('folders', { name: '脚本草稿', icon: '🎬' });
    const f3 = await this.add('folders', { name: '复盘', icon: '🔄' });

    // 笔记
    const sampleNotes = [
      { type: 'short', folderId: f1.id, title: '粉色系调色思路', content: '蜜桃粉做主色调，灰紫做阴影，高光用奶油白。整体偏暖，适合人像特写。', tags: ['调色'], createdAt: now - 3600000 },
      { type: 'long', folderId: f2.id, title: '「夏日复古风」Vlog 脚本 v2', content: '开场：推门进入咖啡馆，BGM渐入。\n第一幕：点单特写，强调复古杯子。\n第二幕：靠窗座位，自然光人像。\n第三幕：咖啡拉花特写，配合卡点。\n结尾：推门离开，画面渐暗。', tags: ['Vlog','脚本'], createdAt: now - 86400000 },
      { type: 'short', folderId: f1.id, title: '转场灵感', content: '用咖啡杯做遮罩转场，杯沿划过镜头的瞬间切换场景，配合卡点BGM。', tags: ['转场'], createdAt: now - 172800000 },

    ];
    for (const n of sampleNotes) await this.add('notes', n);

    // 书籍
    const sampleBooks = [
      { title: '百年孤独', author: '加西亚·马尔克斯', cover: '📕', category: '文学', status: 'reading', createdAt: now - 86400000 * 7 },
      { title: '原则', author: '瑞·达利欧', cover: '📗', category: '成长', status: 'done', createdAt: now - 86400000 * 14 },
      { title: '设计心理学', author: '唐纳德·诺曼', cover: '📘', category: '设计', status: 'reading', createdAt: now - 86400000 * 5 },
      { title: '小王子', author: '安托万·圣埃克苏佩里', cover: '📙', category: '文学', status: 'want', createdAt: now - 86400000 * 3 },
      { title: '人间失格', author: '太宰治', cover: '📕', category: '文学', status: 'done', createdAt: now - 86400000 * 20 },
      { title: '习惯的力量', author: '查尔斯·都希格', cover: '📗', category: '成长', status: 'reading', createdAt: now - 86400000 * 10 },
    ];
    for (const b of sampleBooks) await this.add('books', b);

    // 摘抄（本周8条，上周5条）
    const bookIds = (await this.getAll('books')).map(b => b.id);
    const excerpts = [
      { bookId: bookIds[0], content: '许多年以后，面对行刑队，奥雷里亚诺·布恩迪亚上校将会回想起父亲带他去见识冰块的那个遥远的下午。', page: '第1章', createdAt: now - 3600000 },

<script>
/**
 * app.js — 应用主逻辑
 * 路由、页面渲染、交互
 */

// ===== 全局状态 =====
const state = {
  currentPage: 'home',

  currentNoteFolder: null,
  currentBookFilter: '全部',
  currentInspTag: '全部',
  editingNote: null,
  deferredInstallPrompt: null
};

// ===== 工具函数 =====
function $(sel) { return document.querySelector(sel); }

// 从一段文字中提取真正的URL（处理抖音/小红书分享文字的情况）
function extractUrl(text) {
  if (!text) return '';
  // 匹配 http:// 或 https:// 开头的URL
  const match = text.match(/https?:\/\/[^\s，。！！？\u4e00-\u9fa5]+/i);
  return match ? match[0].replace(/[）)>.,;:！！？？]+$/, '') : '';
}
function $$(sel) { return document.querySelectorAll(sel); }
function el(tag, props = {}, children = []) {
  const e = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'dataset') Object.assign(e.dataset, v);
    else e.setAttribute(k, v);
  });
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
}
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function timeAgo(ts) {
  const diff = Date.now() - ts;
  const min = 60000, hour = 3600000, day = 86400000;
  if (diff < min) return '刚刚';
  if (diff < hour) return Math.floor(diff / min) + '分钟前';
  if (diff < day) return Math.floor(diff / hour) + '小时前';
  if (diff < day * 7) return Math.floor(diff / day) + '天前';
  const d = new Date(ts);
  return `${d.getMonth() + 1}月${d.getDate()}日`;
}
function formatDate(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function todayStr() { return new Date().toISOString().slice(0, 10); }
function getWeekRange(ts) {
  const d = new Date(ts);
  const day = d.getDay() || 7; // 周日=7
  const monday = new Date(d);
  monday.setDate(d.getDate() - day + 1);
  monday.setHours(0, 0, 0, 0);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  sunday.setHours(23, 59, 59, 999);
  return { start: monday.getTime(), end: sunday.getTime() };
}
function showToast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2000);
}

// 素材类型配置

// ===== 路由 =====

  state.currentPage = page;
  state.pageParams = params;

  history.replaceState(null, '', '#' + page);
}

function renderPage() {

  switch (page) {
    case 'home': html = renderHome(); break;
    case 'inspiration': html = renderInspiration(); break;

    case 'material': html = renderMaterial(); break;
    case 'materialDetail': html = renderMaterialDetail(state.pageParams?.id); break;
    case 'note': html = renderNote(); break;
    case 'noteEdit': html = renderNoteEdit(state.pageParams?.id); break;
    case 'reading': html = renderReading(); break;
    case 'bookDetail': html = renderBookDetail(state.pageParams?.id); break;
    case 'todo': html = renderTodo(); break;
    case 'schedule': html = renderSchedule(); break;
    case 'settings': html = renderSettings(); break;
    default: html = renderHome();
  }
  app.innerHTML = html;
  // 页面后置初始化
  if (page === 'material') initMaterialPage();
  if (page === 'note') initNotePage();
  if (page === 'reading') initReadingPage();
  if (page === 'inspiration') initInspirationPage();
  if (page === 'noteEdit') initNoteEditPage();
  if (page === 'todo') initTodoPage();
  if (page === 'home') initHomePage();
  if (page === 'settings') initSettingsPage();
  updateNavActive();
}

function updateNavActive() {
  const page = state.currentPage;
  const navMap = { home: 0, inspiration: 1, material: 2, note: 3, reading: 4, search: 1, materialDetail: 2, noteEdit: 3, bookDetail: 4 };
  $$('.nav-item').forEach((n, i) => n.classList.toggle('active', i === navMap[page]));
  const drawerMap = { home: 0, inspiration: 1, material: 2, note: 3, reading: 4, todo: 5, schedule: 6, settings: 7 };

async function initHomePage() {
  const now = Date.now();
  const today = todayStr();
  const d = new Date();
  const weekdays = ['日','一','二','三','四','五','六'];
  $('#homeDateText').textContent = `今天是 ${d.getMonth()+1}月${d.getDate()}日 周${weekdays[d.getDay()]}`;

  // 待办统计
  const todos = await DB.getAll('todos');
  const todayTodos = todos.filter(t => t.date === today);
  const doneCount = todayTodos.filter(t => t.done).length;
  $('#widgetTodo').innerHTML = `${doneCount}<span class="unit">/${todayTodos.length}</span>`;
  $('#widgetTodoSub').textContent = todayTodos.length - doneCount > 0 ? `还有 ${todayTodos.length - doneCount} 项未完成` : '全部完成啦 🎉';

  // 日程统计
  const schedules = await DB.getAll('schedules');
  const todaySchedules = schedules.filter(s => s.date === today).sort((a,b) => a.time.localeCompare(b.time));
  $('#widgetSchedule').textContent = todaySchedules.length;
  const next = todaySchedules.find(s => !s.done);
  $('#widgetScheduleSub').textContent = next ? `下一项 ${next.time} ${next.title}` : '今日无更多日程';

  // 阅读统计
  const excerpts = await DB.getAll('excerpts');
  const thisWeek = getWeekRange(now);
  const lastWeek = { start: thisWeek.start - 86400000 * 7, end: thisWeek.start - 1 };
  const thisWeekCount = excerpts.filter(e => e.createdAt >= thisWeek.start && e.createdAt <= thisWeek.end).length;
  const lastWeekCount = excerpts.filter(e => e.createdAt >= lastWeek.start && e.createdAt <= lastWeek.end).length;
  $('#widgetReading').innerHTML = `${thisWeekCount}<span class="unit"> 条摘抄</span>`;
  const trend = lastWeekCount === 0 ? '本周开始记录' : `↑ 上周 ${lastWeekCount} 条 · +${Math.round((thisWeekCount - lastWeekCount) / lastWeekCount * 100)}%`;
  $('#widgetReadingTrend').textContent = thisWeekCount >= lastWeekCount ? trend : `↓ 上周 ${lastWeekCount} 条`;

  // 素材统计
  const materials = await DB.getAll('materials');
  $('#widgetMaterial').textContent = materials.length;
  const todayMaterials = materials.filter(m => m.createdAt > now - 86400000);
  $('#widgetMaterialSub').textContent = todayMaterials.length > 0 ? `今日新增 ${todayMaterials.length} 条` : '点击右上角添加';

  // 最近素材横滑

    ? '<div style="padding:10px 16px;color:var(--text-light);font-size:13px;">还没有素材，点右上角添加吧</div>'
    : recentMaterials.map(m => {
      const t = MATERIAL_TYPES[m.type] || MATERIAL_TYPES.text;
      const colorIdx = m.title ? m.title.charCodeAt(0) % 4 : 0;
      const hasImg = m.cover && m.cover.indexOf('data:image') === 0;

        <div class="recent-thumb" style="background:${getCoverBg(colorIdx)}">${hasImg ? `<img src="${m.cover}" alt="素材图片">` : t.icon}</div>
        <div class="recent-info"><div class="recent-title">${escapeHtml(m.title)}</div><div class="recent-tag">${t.badge}${m.sourcePlatform ? ' · ' + m.sourcePlatform : ''}</div></div>
      </div>`;
    }).join('');
  $('#homeRecentMaterials').innerHTML = recentHtml;

  // 最近收藏流
  const feedMaterials = materials.sort((a,b) => b.createdAt - a.createdAt).slice(0, 3);
  const feedHtml = feedMaterials.length === 0
    ? '<div style="padding:10px 0;color:var(--text-light);font-size:13px;">还没有收藏，去素材库添加吧</div>'

    'linear-gradient(135deg,var(--lavender-light),var(--lavender))',

  // 收集所有标签
  const allTags = new Set();
  materials.forEach(m => (m.tags || []).forEach(t => allTags.add(t)));
  const tagsList = ['全部', ...Array.from(allTags)];

  // 渲染标签
  const tag = state.currentMaterialFilter.tag;
  $('#materialTags').innerHTML = tagsList.map(t =>
    `<div class="insp-tab ${t === tag ? 'active' : ''}" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</div>`
  ).join('');
  $$('#materialTags .insp-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      state.currentMaterialFilter.tag = tab.dataset.tag;
      initMaterialPage();
    });
  });

  // 渲染合集
  const colHtml = collections.map(c => {
    const count = materials.filter(m => m.collectionId === c.id).length;
    const colorIdx = (c.name || '').charCodeAt(0) % 3;
    return `<div class="collection-card ${['','alt','alt2'][colorIdx]}" onclick="filterByCollection('${c.id}')" style="position:relative">
      <div class="collection-name">${c.icon || '📁'} ${escapeHtml(c.name)} <span style="font-size:12px;opacity:.5;cursor:pointer" onclick="event.stopPropagation();openEditCollectionSheet('${c.id}')">✏️</span></div>
      <div class="collection-count">${count} 条素材</div>
    </div>`;
  }).join('') + `<div class="collection-card" style="background:#fff;border:2px dashed var(--lavender-light)" onclick="openNewCollectionSheet()"><div class="collection-name" style="color:var(--text-secondary)">＋ 新建</div><div class="collection-count">自定义合集</div></div>`;
  $('#materialCollections').innerHTML = colHtml;

  // 过滤素材
  let filtered = materials.sort((a,b) => b.createdAt - a.createdAt);
  if (state.currentMaterialFilter.collectionId) {
    filtered = filtered.filter(m => m.collectionId === state.currentMaterialFilter.collectionId);
  }
  if (tag !== '全部') {
    filtered = filtered.filter(m => (m.tags || []).includes(tag));
  }
  const search = state.currentMaterialFilter.search;
  if (search) {
    const s = search.toLowerCase();
    filtered = filtered.filter(m =>
      (m.title || '').toLowerCase().includes(s) ||
      (m.note || '').toLowerCase().includes(s) ||
      (m.tags || []).some(t => t.toLowerCase().includes(s))
    );
  }

  let countText = `${filtered.length} 条`;
  if (state.currentMaterialFilter.collectionId) {
    const col = collections.find(c => c.id === state.currentMaterialFilter.collectionId);
    if (col) countText = `${filtered.length} 条 · 在「${col.name}」中 <span style="color:var(--lavender);cursor:pointer;font-weight:600" onclick="clearCollectionFilter()">× 清除筛选</span>`;
  }
  $('#materialCount').innerHTML = countText;

  // 瀑布流
  const html = filtered.length === 0
    ? '<div class="empty-state" style="column-span:all"><div class="empty-state-icon">📭</div><div class="empty-state-text">没有找到素材<br>试试其他筛选条件</div></div>'
    : filtered.map((m, i) => {
      const t = MATERIAL_TYPES[m.type] || MATERIAL_TYPES.text;
      const hIdx = i % 4;
      const hasImg = m.cover && m.cover.indexOf('data:image') === 0;
      return `<div class="wf-item" onclick="go('materialDetail',{id:'${m.id}'})">
        <div class="wf-thumb ${COVER_HEIGHTS[hIdx]}" style="background:${getCoverBg(i % 4)}">${hasImg ? `<img src="${m.cover}" alt="素材图片">` : t.icon}<span class="wf-type-badge">${t.badge}</span></div>
        <div class="wf-info">
          <div class="wf-title">${escapeHtml(m.title || '未命名')}</div>
          <div class="wf-tags">${(m.tags || []).slice(0, 3).map(tg => `<span class="wf-mini-tag">${escapeHtml(tg)}</span>`).join('')}</div>
        </div>
      </div>`;
    }).join('');
  $('#materialWaterfall').innerHTML = html;

  // 搜索框
  const searchInput = $('#materialSearchInput');
  if (searchInput) {
    searchInput.value = state.currentMaterialFilter.search;
    searchInput.addEventListener('input', (e) => {
      state.currentMaterialFilter.search = e.target.value;
      clearTimeout(searchInput._timer);
      searchInput._timer = setTimeout(() => initMaterialPage(), 300);
    });
  }
}

async function renderMaterialDetailContent(id) {
  const m = await DB.get('materials', id);
  if (!m) { go('material'); return; }
  const t = MATERIAL_TYPES[m.type] || MATERIAL_TYPES.text;
  const colorIdx = m.title ? m.title.charCodeAt(0) % 4 : 0;

  let html;
  if (m.cover && m.cover.indexOf('data:image') === 0) {
    html = `<div class="detail-cover" style="background:${getCoverBg(colorIdx)}"><img src="${m.cover}" alt="素材图片"></div>`;
  } else {
    html = `<div class="detail-cover c${colorIdx + 1}">${t.icon}</div>`;
  }

  html += `<div style="padding:16px 0">
    <div class="detail-section">
      <div style="font-size:17px;font-weight:700;margin-bottom:8px">${escapeHtml(m.title || '未命名素材')}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <span class="tag tag-lavender">${t.badge}</span>
        ${(m.tags || []).map(tg => `<span class="tag tag-peach">${escapeHtml(tg)}</span>`).join('')}
      </div>
    </div>`;

  // BGM 播放器
  if (m.type === 'bgm') {
    html += `<div class="detail-section">
      <div class="detail-label">🎵 音乐播放</div>
      <div class="bgm-player">
        <div class="bgm-cover">🎵</div>
        <div class="bgm-info">
          <div class="bgm-title">${escapeHtml(m.title || '未知音乐')}</div>
          <div class="bgm-source">来源：${escapeHtml(m.sourcePlatform || '未知')}</div>
        </div>
        <div class="bgm-play" onclick="playBgm('${id}')">▶</div>
      </div>
      ${m.sourceUrl ? `<div style="margin-top:10px"><a href="${escapeHtml(extractUrl(m.sourceUrl) || m.sourceUrl)}" target="_blank" rel="noopener" class="link-jump-btn" style="text-decoration:none;display:flex">🔗 跳转到${escapeHtml(m.sourcePlatform || '原平台')}播放 →</a></div>` : ''}
    </div>`;
  }

  // 视频播放
  if (m.videoBlob) {
    const videoUrl = URL.createObjectURL(m.videoBlob);
    html += `<div class="detail-section"><div class="detail-label">🎬 视频</div><video src="${videoUrl}" controls style="width:100%;border-radius:10px;background:#000"></video></div>`;
  }

  // 备注
  if (m.note) {
    html += `<div class="detail-section"><div class="detail-label">📝 备注</div><div class="detail-content">${escapeHtml(m.note)}</div></div>`;
  }

  // 原始链接
  if (m.sourceUrl && m.type !== 'bgm') {
    html += `<div class="detail-section"><div class="detail-label">🔗 原始链接</div><a href="${escapeHtml(extractUrl(m.sourceUrl) || m.sourceUrl)}" target="_blank" rel="noopener" class="link-jump-btn" style="text-decoration:none;display:flex">🔗 打开原始内容 →</a></div>`;
  }

  // 文字内容
  if (m.type === 'text' && m.content) {
    html += `<div class="detail-section"><div class="detail-label">✏️ 文字内容</div><div class="detail-content">${escapeHtml(m.content)}</div></div>`;
  }

  // 添加日期
  html += `<div class="detail-section"><div class="detail-label">📅 添加日期</div><div class="detail-content">${formatDate(m.createdAt)}</div></div>`;

  // 合集
  if (m.collectionId) {
    const col = await DB.get('collections', m.collectionId);
    if (col) {
      html += `<div class="detail-section"><div class="detail-label">📂 所属合集</div><div class="detail-content">${col.icon || '📁'} ${escapeHtml(col.name)}</div></div>`;
    }
  }

  html += `</div>`;
  $('#materialDetailContent').innerHTML = html;
}

async function initNoteEditPage() {
  const id = state.pageParams?.id;
  const folders = await DB.getAll('folders');
  const folderSelect = $('#noteFolderSelect');
  folders.forEach(f => {
    const opt = document.createElement('option');
    opt.value = f.id;
    opt.textContent = (f.icon || '📁') + ' ' + f.name;
    folderSelect.appendChild(opt);
  });

  let note = { type: 'short', tags: [], folderId: '', title: '', content: '' };
  if (id) {
    note = await DB.get('notes', id);
    if (!note) { go('note'); return; }
  }

  $('#noteTitleInput').value = note.title || '';
  $('#noteContentInput').value = note.content || '';
  $('#noteTypeSelect').value = note.type || 'short';
  if (note.folderId) $('#noteFolderSelect').value = note.folderId;

  // 标签输入
  const tagArea = $('#noteTagInput');
  const tagInput = tagArea.querySelector('input');
  let tags = [...(note.tags || [])];
  function renderTags() {
    tagArea.querySelectorAll('.tag-pill').forEach(p => p.remove());
    tags.forEach((t, i) => {
      const pill = document.createElement('span');
      pill.className = 'tag-pill';
      pill.innerHTML = `${escapeHtml(t)} <span class="remove">×</span>`;
      pill.querySelector('.remove').addEventListener('click', () => { tags.splice(i, 1); renderTags(); });
      tagArea.insertBefore(pill, tagInput);
    });
  }
  renderTags();
  tagInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && tagInput.value.trim()) {
      e.preventDefault();
      tags.push(tagInput.value.trim());
      tagInput.value = '';
      renderTags();
    }
  });

  state.editingNote = { id, tags };
}

async function saveNote(id) {
  const title = $('#noteTitleInput').value.trim();
  const content = $('#noteContentInput').value.trim();
  const type = $('#noteTypeSelect').value;
  const folderId = $('#noteFolderSelect').value || null;
  const tags = state.editingNote?.tags || [];

  if (!content) { showToast('内容不能为空'); return; }

  if (id) {
    const note = await DB.get('notes', id);
    note.title = title;
    note.content = content;
    note.type = type;
    note.folderId = folderId;
    note.tags = tags;
    await DB.put('notes', note);
    showToast('已保存');
  } else {
    await DB.add('notes', { title, content, type, folderId, tags });
    showToast('已创建');
  }
  go('note');
}

async function initReadingPage() {
  const books = await DB.getAll('books');
  const excerpts = await DB.getAll('excerpts');
  const now = Date.now();
  const thisWeek = getWeekRange(now);
  const lastWeek = { start: thisWeek.start - 86400000 * 7, end: thisWeek.start - 1 };
  const thisWeekExcerpts = excerpts.filter(e => e.createdAt >= thisWeek.start && e.createdAt <= thisWeek.end);
  const lastWeekExcerpts = excerpts.filter(e => e.createdAt >= lastWeek.start && e.createdAt <= lastWeek.end);

  const trendText = lastWeekExcerpts.length === 0
    ? '本周开始记录'
    : thisWeekExcerpts.length >= lastWeekExcerpts.length
      ? `↑ 比上周多 ${thisWeekExcerpts.length - lastWeekExcerpts.length} 条`
      : `↓ 比上周少 ${lastWeekExcerpts.length - thisWeekExcerpts.length} 条`;

  $('#readingStats').innerHTML = `
    <div class="reading-stat-main">
      <div class="reading-stat-label">本周摘抄</div>
      <div><span class="reading-stat-num">${thisWeekExcerpts.length}</span><span class="reading-stat-unit">条</span></div>
      <div class="reading-stat-trend">${trendText}</div>
    </div>
    <div class="reading-stat-compare">
      <div class="label">上周</div>
      <div class="num">${lastWeekExcerpts.length}</div>
      <div class="label" style="margin-top:2px">条</div>
    </div>
  `;

  // 分类
  const categories = new Set(books.map(b => b.category).filter(Boolean));
  const catList = ['全部', ...Array.from(categories)];
  $('#readingCategories').innerHTML = catList.map(c =>
    `<div class="folder-chip ${c === state.currentBookFilter ? 'active' : ''}" data-cat="${escapeHtml(c)}">📚 ${escapeHtml(c)}</div>`
  ).join('') + `<div class="folder-chip" style="background:var(--lavender-bg);color:var(--lavender)" onclick="openAddCategorySheet()">＋ 新建</div>`;
  $$('#readingCategories .folder-chip[data-cat]').forEach(c => {
    c.addEventListener('click', () => {
      state.currentBookFilter = c.dataset.cat;
      initReadingPage();
    });
  });

  // 书架
  let filteredBooks = books.sort((a,b) => b.createdAt - a.createdAt);
  if (state.currentBookFilter !== '全部') {
    filteredBooks = filteredBooks.filter(b => b.category === state.currentBookFilter);
  }
  $('#bookCount').textContent = `${filteredBooks.length} 本`;

  const coverColors = ['b1','b2','b3','b4','b5','b6'];
  const coverBgs = [
    'linear-gradient(135deg,var(--peach),#D4847A)',
    'linear-gradient(135deg,var(--mist-blue),#6B9BB5)',
    'linear-gradient(135deg,var(--lavender),#9B7FC5)',
    'linear-gradient(135deg,#A8D5BA,#7BBF8A)',
    'linear-gradient(135deg,#F0C2A8,#D4847A)',
    'linear-gradient(135deg,#B8C5D6,#6B9BB5)'
  ];
  const statusMap = { reading: ['在读','status-reading'], done: ['已读','status-done'], want: ['想读','status-want'] };

  const bookHtml = filteredBooks.length === 0
    ? '<div style="grid-column:span 3" class="empty-state"><div class="empty-state-icon">📚</div><div class="empty-state-text">还没有书籍<br>点右上角添加</div></div>'
    : filteredBooks.map((b, i) => {
      const st = statusMap[b.status] || statusMap.want;
      return `<div class="book-card" onclick="go('bookDetail',{id:'${b.id}'})">
        <div class="book-cover ${coverColors[i % 6]}" style="background:${coverBgs[i % 6]}">${renderCover(b.cover)}</div>
        <div class="book-info">
          <div class="book-title">${escapeHtml(b.title)}</div>
          <div class="book-author">${escapeHtml(b.author || '')}</div>
          <span class="book-status ${st[1]}">${st[0]}</span>
        </div>
      </div>`;
    }).join('');
  $('#bookShelf').innerHTML = bookHtml;

  // 摘抄
  const sortedExcerpts = excerpts.sort((a,b) => b.createdAt - a.createdAt).slice(0, 10);
  const excerptHtml = sortedExcerpts.length === 0
    ? '<div class="empty-state"><div class="empty-state-icon">✍️</div><div class="empty-state-text">还没有摘抄<br>进入书籍详情添加</div></div>'
    : sortedExcerpts.map(e => {
      const book = books.find(b => b.id === e.bookId);
      const cat = book ? book.category : '';
      const tagClass = cat === '文学' ? 'tag-lavender' : cat === '成长' ? 'tag-blue' : 'tag-peach';
      return `<div class="note-card" style="border-left:3px solid var(--lavender)" onclick="${book ? `go('bookDetail',{id:'${book.id}'})` : ''}">
        <div class="note-type">📖 《${escapeHtml(book ? book.title : '未知')}》${e.page ? ' · ' + escapeHtml(e.page) : ''}</div>
        <div class="note-preview">"${escapeHtml(e.content)}"</div>
        ${e.readingTakeaway ? '<div class="note-takeaway">💭 ' + escapeHtml(e.readingTakeaway) + '</div>' : ''}
        <div class="note-footer">
          <span class="note-date">${timeAgo(e.createdAt)}</span>
          ${cat ? `<span class="tag ${tagClass}">${escapeHtml(cat)}</span>` : ''}
        </div>
      </div>`;
    }).join('');
  $('#excerptList').innerHTML = excerptHtml;
}

async function renderBookDetailContent(id) {
  const book = await DB.get('books', id);
  if (!book) { go('reading'); return; }
  const excerpts = (await DB.getByIndex('excerpts', 'bookId', id)).sort((a,b) => b.createdAt - a.createdAt);
  const statusMap = { reading: ['在读','status-reading'], done: ['已读','status-done'], want: ['想读','status-want'] };
  const st = statusMap[book.status] || statusMap.want;

  let html = `<div style="padding:20px 16px;text-align:center;background:linear-gradient(135deg,var(--lavender-bg),var(--mist-blue-bg))">
    <div style="width:100px;height:133px;margin:0 auto 12px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:48px;overflow:hidden;box-shadow:var(--shadow-soft);background:#fff">${renderCover(book.cover)}</div>
    <div style="font-size:20px;font-weight:800">${escapeHtml(book.title)}</div>
    <div style="font-size:14px;color:var(--text-secondary);margin-top:4px">${escapeHtml(book.author || '')}</div>
    <div style="margin-top:8px"><span class="tag tag-peach">${escapeHtml(book.category || '未分类')}</span> <span class="book-status ${st[1]}">${st[0]}</span></div>
  </div>`;

  html += `<div class="section-title">摘抄 <span class="more">${excerpts.length} 条</span></div>`;
  html += `<div class="note-list">`;
  if (excerpts.length === 0) {
    html += '<div class="empty-state"><div class="empty-state-icon">✍️</div><div class="empty-state-text">还没有摘抄<br>点击下方按钮添加</div></div>';
  } else {
    html += excerpts.map(e => `<div class="note-card" style="border-left:3px solid var(--lavender)">
      <div class="note-type">${e.page ? escapeHtml(e.page) : '摘抄'} · ${timeAgo(e.createdAt)}</div>
      <div class="note-preview">"${escapeHtml(e.content)}"</div>
      ${e.readingTakeaway ? '<div class="note-takeaway">💭 ' + escapeHtml(e.readingTakeaway) + '</div>' : ''}
      <div style="margin-top:8px;display:flex;gap:12px">
        <span style="font-size:12px;color:var(--lavender);cursor:pointer" onclick="openEditExcerptSheet('${e.id}','${id}')">✏️ 编辑</span>
        <span style="font-size:12px;color:#E07070;cursor:pointer" onclick="deleteExcerpt('${e.id}','${id}')">🗑️ 删除</span>
      </div>
    </div>`).join('');
  }
  html += `</div>`;
  html += `<div style="padding:0 16px"><button class="btn-primary" onclick="openAddExcerptSheet('${id}')">＋ 添加摘抄</button></div>`;
  html += `<div style="padding:8px 16px"><button class="btn-danger" onclick="deleteBook('${id}')">🗑️ 删除此书</button></div>`;

  $('#bookDetailContent').innerHTML = html;
}

async function deleteBook(id) {
  if (!confirm('确定删除这本书及其所有摘抄吗？')) return;
  const excerpts = await DB.getByIndex('excerpts', 'bookId', id);
  for (const e of excerpts) await DB.delete('excerpts', e.id);
  await DB.delete('books', id);
  showToast('已删除');
  go('reading');

async function initTodoPage() {
  const todos = await DB.getAll('todos');
  const today = todayStr();
  const tomorrow = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
  const todayTodos = todos.filter(t => t.date === today).sort((a,b) => (a.time||'').localeCompare(b.time||''));
  const tomorrowTodos = todos.filter(t => t.date === tomorrow).sort((a,b) => (a.time||'').localeCompare(b.time||''));
  const otherTodos = todos.filter(t => t.date !== today && t.date !== tomorrow).sort((a,b) => (a.time||'').localeCompare(b.time||''));

  let html = '';
  if (todayTodos.length > 0) {
    html += `<div style="font-size:13px;color:var(--text-secondary);margin-bottom:12px;font-weight:500">今天 · ${today.slice(5).replace('-','月')}日</div>`;
    html += todayTodos.map(t => renderTodoItem(t)).join('');
  }
  if (tomorrowTodos.length > 0) {
    html += `<div style="font-size:13px;color:var(--text-secondary);margin:24px 0 12px;font-weight:500">明天 · ${tomorrow.slice(5).replace('-','月')}日</div>`;
    html += tomorrowTodos.map(t => renderTodoItem(t)).join('');
  }
  if (otherTodos.length > 0) {
    html += `<div style="font-size:13px;color:var(--text-secondary);margin:24px 0 12px;font-weight:500">更多</div>`;
    html += otherTodos.map(t => renderTodoItem(t)).join('');
  }
  if (html === '') {
    html = '<div class="empty-state"><div class="empty-state-icon">☑️</div><div class="empty-state-text">还没有待办<br>点右上角添加</div></div>';
  }
  $('#todoList').innerHTML = html;

  // 绑定勾选
  $$('.todo-check').forEach(c => {
    c.addEventListener('click', async (e) => {
      e.stopPropagation();
      const id = c.dataset.id;
      const todo = await DB.get('todos', id);
      todo.done = !todo.done;
      todo.doneAt = todo.done ? Date.now() : null;
      await DB.put('todos', todo);
      initTodoPage();
    });
  });
}

function renderTodoItem(t) {
  return `<div class="todo-item ${t.done ? 'done' : ''}">
    <div class="todo-check ${t.done ? 'done' : ''}" data-id="${t.id}">${t.done ? '✓' : ''}</div>
    <div class="todo-text" onclick="openEditTodoSheet('${t.id}')">${escapeHtml(t.text)}</div>
    <div class="todo-time">${escapeHtml(t.time || '')}</div>
    <span style="font-size:18px;color:var(--text-light);cursor:pointer;padding:0 4px;" onclick="event.stopPropagation();deleteTodo('${t.id}')">×</span>

}

async function initSettingsPage() {
  const stats = $('#dataStats');
  if (!stats) return;
  const stores = ['materials','collections','notes','folders','books','excerpts','todos','schedules'];
  const names = { materials:'素材', collections:'合集', notes:'笔记', folders:'文件夹', books:'书籍', excerpts:'摘抄', todos:'待办', schedules:'日程' };
  let html = '';
  for (const s of stores) {
    const count = (await DB.getAll(s)).length;
    html += `${names[s]}：${count} 条<br>`;
  }
  stats.innerHTML = html;

  const importFile = $('#importFile');
  if (importFile) {
    importFile.addEventListener('change', importBackup);
  }
}

async function exportBackup() {
  const data = await DB.exportAll();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `灵感工作台备份_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('备份已导出');
}

async function importBackup(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (!confirm('导入会覆盖当前所有数据，确定继续吗？')) return;
  try {
    const text = await file.text();
    const backup = JSON.parse(text);
    await DB.importAll(backup);
    // 导入数据后，标记已初始化，永不再注入示例数据
    localStorage.setItem('dataCleared', '1');
    showToast('导入成功');
    go('home');
  } catch (err) {
    showToast('导入失败：文件格式错误');
  }
}

async function clearAllData() {
  if (!confirm('确定要清空所有数据吗？此操作不可恢复！')) return;
  if (!confirm('再次确认：所有素材、笔记、书籍、待办都将被删除！')) return;
  for (const s of Object.keys(DB.STORES)) {
    await DB.clear(s);
  }
  // 标记已清空，永不再注入示例数据
  localStorage.setItem('dataCleared', '1');
  showToast('已清空所有数据');
  go('home');
}

let _matImageData = null;

function onMatImageChange(e) {

function onMatVideoChange(e) {
  const file = e.target.files[0];
  if (!file) return;

  const pl = document.getElementById('matVideoPlaceholder');

function initTagInput(containerId, initialTags = []) {
  const area = $('#' + containerId);
  if (!area) return;
  const input = area.querySelector('input');
  let tags = [...initialTags];
  function render() {
    area.querySelectorAll('.tag-pill').forEach(p => p.remove());
    tags.forEach((t, i) => {
      const pill = document.createElement('span');
      pill.className = 'tag-pill';
      pill.innerHTML = `${escapeHtml(t)} <span class="remove">×</span>`;
      pill.querySelector('.remove').addEventListener('click', () => { tags.splice(i, 1); render(); });
      area.insertBefore(pill, input);
    });
  }
  render();
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && input.value.trim()) {
      e.preventDefault();
      tags.push(input.value.trim());
      input.value = '';
      render();
    }
  });
  state['_tags_' + containerId] = () => tags;
}

async function saveMaterial(id) {
  const type = $('#matTypeSelect').value;
  const title = $('#matTitleInput').value.trim();
  const rawUrl = $('#matUrlInput') ? $('#matUrlInput').value.trim() : '';
  // 自动从文字中提取真正的URL（用户可能粘贴了抖音/小红书的整段分享文字）
  const sourceUrl = extractUrl(rawUrl) || rawUrl;
  const sourcePlatform = $('#matPlatformInput') ? $('#matPlatformInput').value.trim() : '';
  const content = $('#matContentInput') ? $('#matContentInput').value.trim() : '';
  const note = $('#matNoteInput').value.trim();
  const tags = state['_tags_matTagInput'] ? state['_tags_matTagInput']() : [];
  const collectionId = state._selectedCollection ? state._selectedCollection() : null;

  if (!title) { showToast('请填写标题'); return; }

  const data = { type, title, sourceUrl, sourcePlatform, content, note, tags, collectionId };
  // 上传的媒体文件
  if (_matImageData) data.cover = _matImageData;
  if (_matVideoFile) data.videoBlob = _matVideoFile;
  if (id) {
    data.id = id;
    const old = await DB.get('materials', id);
    data.createdAt = old.createdAt;
    // 编辑时如果没有重新上传，保留原有的图片/视频
    if (!_matImageData && old.cover) data.cover = old.cover;
    if (!_matVideoFile && old.videoBlob) data.videoBlob = old.videoBlob;
    await DB.put('materials', data);
    showToast('已保存');
  } else {
    await DB.add('materials', data);
    showToast('已添加');
  }
  closeModal();
  if (state.currentPage === 'material') initMaterialPage();
  if (state.currentPage === 'materialDetail') renderMaterialDetailContent(id);
  if (state.currentPage === 'home') initHomePage();
}

// === 封面图片裁剪 ===
let _coverState = { zoom: 1, tx: 0, ty: 0, dataUrl: null };
function onCoverFileChange(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    _coverState.dataUrl = ev.target.result;
    const frame = document.getElementById('coverCropFrame');
    const inner = document.getElementById('coverCropInner');
    const img = document.getElementById('coverCropImg');
    img.src = _coverState.dataUrl;
    img.style.display = 'block';
    _coverState.zoom = 1; _coverState.tx = 0; _coverState.ty = 0;
    inner.style.transform = 'translate(0,0) scale(1)';
    frame.classList.add('has-image');
    const pl = frame.querySelector('.cover-upload-placeholder');
    if (pl) pl.style.display = 'none';
    document.getElementById('coverZoomControl').style.display = 'flex';
    const slider = document.getElementById('coverZoomSlider');
    const innerEl = document.getElementById('coverCropInner');
    slider.value = 1;
    slider.oninput = function() {
      _coverState.zoom = parseFloat(this.value);
      innerEl.style.transform = 'translate('+_coverState.tx+'px,'+_coverState.ty+'px) scale('+_coverState.zoom+')';
    };
    let drag = false, sx, sy;
    function pd(e) { drag = true; sx = e.clientX - _coverState.tx; sy = e.clientY - _coverState.ty; inner.setPointerCapture(e.pointerId); }
    function pm(e) { if (!drag) return; _coverState.tx = e.clientX - sx; _coverState.ty = e.clientY - sy; innerEl.style.transform = 'translate('+_coverState.tx+'px,'+_coverState.ty+'px) scale('+_coverState.zoom+')'; }
    function pu() { drag = false; }
    inner.addEventListener('pointerdown', pd);
    inner.addEventListener('pointermove', pm);
    inner.addEventListener('pointerup', pu);
  };
  reader.readAsDataURL(file);
}
function getCroppedCover() {
  if (!_coverState.dataUrl) return '📕';
  const frame = document.getElementById('coverCropFrame');
  const img = document.getElementById('coverCropImg');
  if (!img || !img.naturalWidth) return '📕';
  const fr = frame.getBoundingClientRect();
  const ir = img.getBoundingClientRect();
  const c = document.createElement('canvas'); c.width = 200; c.height = 200;
  const ctx = c.getContext('2d');
  ctx.drawImage(img,
    (fr.left - ir.left) / ir.width * img.naturalWidth,
    (fr.top - ir.top) / ir.height * img.naturalHeight,
    fr.width / ir.width * img.naturalWidth,
    fr.height / ir.height * img.naturalHeight,
    0, 0, 200, 200);
  return c.toDataURL('image/jpeg', 0.8);
}

// 渲染封面（兼容emoji和上传图片）

  if (cover && cover.indexOf('data:image') === 0) {

  }
  return cover || '📕';
}

                <span class="cover-hint">缩放 · 拖动调整位置</span>
              </div>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">分类</label>
            <input class="form-input" id="bookCategoryInput" value="${escapeHtml(book.category || '')}">
          </div>
          <div class="form-group">
            <label class="form-label">阅读状态</label>
            <div style="display:flex;gap:8px">
              <span class="filter-chip ${book.status==='want'?'active':''}" data-status="want" onclick="selectBookStatus(this)">想读</span>
              <span class="filter-chip ${book.status==='reading'?'active':''}" data-status="reading" onclick="selectBookStatus(this)">在读</span>
              <span class="filter-chip ${book.status==='done'?'active':''}" data-status="done" onclick="selectBookStatus(this)">已读</span>
            </div>
          </div>
          <button class="btn-primary" onclick="saveBook('${id}')">保存修改</button>
          <button class="btn-secondary" onclick="closeModal()">取消</button>
        </div>
      </div>`;
    modalContainer.innerHTML = html;
    if (book.cover && book.cover.indexOf("data:image")===0) {
      _coverState.dataUrl = book.cover;
      setTimeout(function() {
        var fr = document.getElementById("coverCropFrame");
        var inn = document.getElementById("coverCropInner");
        var im = document.getElementById("coverCropImg");
        if (im && fr) {
          im.src = book.cover;
          im.style.display = "block";
          _coverState.zoom = 1; _coverState.tx = 0; _coverState.ty = 0;
          inn.style.transform = "translate(0,0) scale(1)";
          fr.classList.add("has-image");
          var pl = fr.querySelector(".cover-upload-placeholder");
          if (pl) pl.style.display = "none";
        }
      }, 50);
    }
    state._bookStatus = book.status;
  });
}

// ===== 搜索功能 =====
function initSearchPage() {
  const input = $('#searchInput');
  if (!input) return;
  let timer;
  input.addEventListener('input', (e) => {
    clearTimeout(timer);
    timer = setTimeout(() => doSearch(e.target.value), 300);
  });
}

async function doSearch(query) {
  const results = $('#searchResults');
  if (!query || !query.trim()) {
    results.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔍</div><div class="empty-state-text">输入关键词搜索你的素材库</div></div>';
    return;
  }
  const q = query.toLowerCase();
  const materials = await DB.getAll('materials');
  const notes = await DB.getAll('notes');
  const excerpts = await DB.getAll('excerpts');
  const books = await DB.getAll('books');

  const matResults = materials.filter(m =>
    (m.title || '').toLowerCase().includes(q) ||
    (m.note || '').toLowerCase().includes(q) ||
    (m.tags || []).some(t => t.toLowerCase().includes(q))
  );
  const noteResults = notes.filter(n =>
    (n.title || '').toLowerCase().includes(q) ||
    (n.content || '').toLowerCase().includes(q) ||
    (n.tags || []).some(t => t.toLowerCase().includes(q))
  );
  const excerptResults = excerpts.filter(e => (e.content || '').toLowerCase().includes(q));
  const bookResults = books.filter(b =>
    (b.title || '').toLowerCase().includes(q) ||
    (b.author || '').toLowerCase().includes(q)
  );

  let html = '';
  if (matResults.length === 0 && noteResults.length === 0 && excerptResults.length === 0 && bookResults.length === 0) {
    html = '<div class="empty-state"><div class="empty-state-icon">🔍</div><div class="empty-state-text">没有找到相关内容</div></div>';
  } else {
    if (matResults.length > 0) {
      html += `<div style="font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:8px">📦 素材 (${matResults.length})</div>`;
      html += matResults.map(m => renderInspCard(m)).join('');
    }
    if (noteResults.length > 0) {
      html += `<div style="font-size:13px;font-weight:600;color:var(--text-secondary);margin:16px 0 8px">📝 笔记 (${noteResults.length})</div>`;
      html += noteResults.map(n => `<div class="note-card ${n.type}" onclick="go('noteEdit',{id:'${n.id}'})">
        <div class="note-type">${n.type === 'short' ? '💡 短记录' : '📝 长文'}</div>
        ${n.title ? `<div class="note-title">${escapeHtml(n.title)}</div>` : ''}
        <div class="note-preview">${escapeHtml(n.content || '')}</div>
      </div>`).join('');
    }
    if (bookResults.length > 0) {
      html += `<div style="font-size:13px;font-weight:600;color:var(--text-secondary);margin:16px 0 8px">📚 书籍 (${bookResults.length})</div>`;
      html += bookResults.map(b => `<div class="note-card" style="border-left:3px solid var(--lavender)" onclick="go('bookDetail',{id:'${b.id}'})">
        <div class="note-type">📖 ${escapeHtml(b.category || '')}</div>
        <div class="note-title">${escapeHtml(b.title)}</div>
        <div class="note-preview">${escapeHtml(b.author || '')}</div>
      </div>`).join('');
    }
    if (excerptResults.length > 0) {
      html += `<div style="font-size:13px;font-weight:600;color:var(--text-secondary);margin:16px 0 8px">✍️ 摘抄 (${excerptResults.length})</div>`;
      html += excerptResults.map(e => {
        const book = books.find(b => b.id === e.bookId);
        return `<div class="note-card" style="border-left:3px solid var(--mist-blue)" onclick="${book ? `go('bookDetail',{id:'${book.id}'})` : ''}">
          <div class="note-type">📖 《${escapeHtml(book ? book.title : '未知')}》</div>
          <div class="note-preview">"${escapeHtml(e.content)}"</div>
          ${e.readingTakeaway ? '<div class="note-takeaway">💭 ' + escapeHtml(e.readingTakeaway) + '</div>' : ''}
        </div>`;
      }).join('');
    }
  }
  results.innerHTML = html;
}

// 补充搜索页的初始化到路由
const _origRenderPage = renderPage;
renderPage = function() {
  _origRenderPage();
  if (state.currentPage === 'search') {
    setTimeout(() => {
      const input = $('#searchInput');
      if (input) {
        let timer;
        input.addEventListener('input', (e) => {
          clearTimeout(timer);
          timer = setTimeout(() => doSearch(e.target.value), 300);
        });
        doSearch('');
      }
    }, 0);
  }
  if (state.currentPage === 'materialDetail') {
    renderMaterialDetailContent(state.pageParams?.id);
  }
  if (state.currentPage === 'bookDetail') {
    renderBookDetailContent(state.pageParams?.id);
  }
  if (state.currentPage === 'schedule') {
    initSchedulePage();
  }
};

// ===== 初始化 =====
async function init() {
  // 打开数据库
  await openDB();
  // 注入示例数据（首次使用）
  const seeded = await DB.seedIfEmpty();

  // 事件绑定
  $$('.drawer-item').forEach(item => {
    item.addEventListener('click', () => go(item.dataset.page));
  });
  $$('.nav-item').forEach(item => {
    item.addEventListener('click', () => go(item.dataset.page));
  });
  $('#drawerOverlay').addEventListener('click', closeDrawer);

  // 根据hash初始化页面
  const hash = location.hash.slice(1);
  if (hash && ['home','inspiration','material','note','reading','todo','schedule','settings'].includes(hash)) {
    go(hash);
  } else {
    renderPage();
  }
}

// PWA安装引导
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  state.deferredInstallPrompt = e;
  // 首次访问不显示，之后显示
  if (!localStorage.getItem('installDismissed')) {
    setTimeout(() => $('#installBanner').classList.remove('hide'), 3000);
  }
});

document.addEventListener('DOMContentLoaded', () => {
  $('#installBtn')?.addEventListener('click', async () => {
    if (state.deferredInstallPrompt) {
      state.deferredInstallPrompt.prompt();
      const { outcome } = await state.deferredInstallPrompt.userChoice;
      if (outcome === 'accepted') {
        $('#installBanner').classList.add('hide');
      }
      state.deferredInstallPrompt = null;
    } else {
      showToast('请使用浏览器的"添加到主屏幕"功能');
    }
  });
  $('#installClose')?.addEventListener('click', () => {
    $('#installBanner').classList.add('hide');
    localStorage.setItem('installDismissed', '1');
  });

  init();
});

    try {
      var blob = new Blob([swCode], {type: 'text/javascript'});
