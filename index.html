<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="灵感工作台">
<meta name="theme-color" content="#FDFBF9">
<link rel="manifest" href="manifest.json">
<title>灵感工作台</title>
<style>
:root {
  --peach: #FFB5A7; --peach-light: #FFDDD9; --peach-bg: #FFF5F3;
  --mist-blue: #A8C5D6; --mist-blue-light: #D4E4ED; --mist-blue-bg: #EEF5F9;
  --lavender: #C3B1E1; --lavender-light: #E0D4F0; --lavender-bg: #F6F1FB;
  --cream: #FDFBF9;
  --text-primary: #4A4458; --text-secondary: #8B8599; --text-light: #B5B0C0;
  --green: #7BBF8A; --green-bg: #E8F5E9;
  --shadow-soft: 0 4px 20px rgba(195,177,225,0.15);
  --shadow-card: 0 2px 12px rgba(195,177,225,0.12);
  --radius-lg: 20px; --radius-md: 14px; --radius-sm: 10px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif;
  background:var(--cream);color:var(--text-primary);
  max-width:430px;margin:0 auto;min-height:100vh;
  position:relative;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
/* 性能优化：所有可滚动区域 */
.scroll-area{overflow-y:auto;-webkit-overflow-scrolling:touch;will-change:scroll-position;}
/* 所有按钮：去除点击延迟 */
button,a,.clickable{touch-action:manipulation;-webkit-user-select:none;user-select:none;}

/* 页面容器 */
.page{display:none;min-height:100vh;padding-bottom:90px;animation:fadeIn .2s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* 顶部栏 */
.top-bar{
  position:sticky;top:0;z-index:100;
  background:rgba(253,251,249,0.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  padding:calc(12px + var(--safe-top)) 16px 12px;
  display:flex;align-items:center;gap:12px;
  border-bottom:.5px solid rgba(195,177,225,0.1);
}
.menu-btn{
  width:40px;height:40px;border-radius:12px;
  background:var(--lavender-bg);border:none;
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;
  cursor:pointer;flex-shrink:0;transition:transform .15s;
}
.menu-btn:active{transform:scale(.9);}
.menu-btn span{display:block;width:18px;height:2px;background:var(--lavender);border-radius:2px;}
.top-title{font-size:18px;font-weight:700;flex:1;}
.top-action{
  width:40px;height:40px;border-radius:12px;background:var(--peach-bg);border:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  font-size:22px;color:var(--peach);transition:transform .15s;
}
.top-action:active{transform:scale(.9);}

/* 左侧抽屉 */
.drawer-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(74,68,88,.4);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s;}
.drawer-overlay.open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;left:0;bottom:0;width:280px;background:var(--cream);z-index:201;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);padding:calc(40px + var(--safe-top)) 0 20px;overflow-y:auto;box-shadow:4px 0 30px rgba(195,177,225,.2);}
.drawer.open{transform:translateX(0);}
.drawer-header{padding:0 24px 24px;border-bottom:.5px solid rgba(195,177,225,.15);margin-bottom:16px;}
.drawer-avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--peach),var(--lavender));display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;font-weight:700;margin-bottom:12px;}
.drawer-name{font-size:17px;font-weight:700;}
.drawer-sub{font-size:13px;color:var(--text-secondary);margin-top:2px;}
.drawer-section-label{padding:0 24px;font-size:12px;font-weight:600;color:var(--text-light);letter-spacing:1px;margin:16px 0 8px;}
.drawer-item{display:flex;align-items:center;gap:14px;padding:14px 24px;cursor:pointer;transition:background .15s;position:relative;}
.drawer-item:active{background:var(--lavender-bg);}
.drawer-item.active{background:var(--lavender-bg);}
.drawer-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--lavender);border-radius:0 3px 3px 0;}
.drawer-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.drawer-label{font-size:15px;font-weight:500;}

/* 底部导航 */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(253,251,249,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid rgba(195,177,225,.12);display:flex;padding:8px 0 calc(8px + var(--safe-bottom));z-index:100;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;transition:transform .15s;}
.nav-item:active{transform:scale(.92);}
.nav-icon{font-size:22px;opacity:.5;transition:all .15s;}
.nav-label{font-size:11px;color:var(--text-secondary);font-weight:500;}
.nav-item.active .nav-icon{opacity:1;transform:translateY(-2px);}
.nav-item.active .nav-label{color:var(--lavender);font-weight:600;}

/* 通用组件 */
.card{background:#fff;border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-card);transition:transform .15s;}
.card:active{transform:scale(.98);}
.section-title{font-size:17px;font-weight:700;margin:20px 16px 12px;display:flex;align-items:center;justify-content:space-between;}
.section-title .more{font-size:13px;color:var(--text-secondary);font-weight:400;cursor:pointer;}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500;}
.tag-peach{background:var(--peach-bg);color:#D4847A;}
.tag-blue{background:var(--mist-blue-bg);color:#6B9BB5;}
.tag-lavender{background:var(--lavender-bg);color:#9B7FC5;}
.tag-green{background:var(--green-bg);color:var(--green);}

/* 主页 */
.home-greeting{padding:20px 16px 8px;}
.home-greeting h1{font-size:26px;font-weight:800;line-height:1.3;}
.home-greeting p{font-size:14px;color:var(--text-secondary);margin-top:4px;}
.home-widgets{padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.widget-card{border-radius:var(--radius-lg);padding:16px;position:relative;overflow:hidden;cursor:pointer;transition:transform .15s;}
.widget-card:active{transform:scale(.96);}
.widget-card.peach{background:linear-gradient(135deg,var(--peach-light),var(--peach-bg));}
.widget-card.blue{background:linear-gradient(135deg,var(--mist-blue-light),var(--mist-blue-bg));}
.widget-card.lavender{background:linear-gradient(135deg,var(--lavender-light),var(--lavender-bg));}
.widget-icon{font-size:24px;margin-bottom:8px;}
.widget-title{font-size:13px;color:var(--text-secondary);font-weight:500;}
.widget-value{font-size:22px;font-weight:800;margin-top:2px;}
.widget-value .unit{font-size:14px;font-weight:500;color:var(--text-secondary);}
.widget-sub{font-size:12px;color:var(--text-secondary);margin-top:4px;}
.widget-trend{font-size:11px;font-weight:600;margin-top:2px;color:var(--green);}

/* 横滑列表 */
.h-scroll{display:flex;gap:10px;padding:0 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.h-scroll::-webkit-scrollbar{display:none;}
.recent-item{flex-shrink:0;width:100px;border-radius:var(--radius-md);overflow:hidden;background:#fff;box-shadow:var(--shadow-card);cursor:pointer;transition:transform .15s;}
.recent-item:active{transform:scale(.95);}
.recent-thumb{width:100px;height:100px;display:flex;align-items:center;justify-content:center;font-size:32px;}
.recent-info{padding:8px 10px;}
.recent-title{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.recent-tag{font-size:10px;color:var(--text-light);margin-top:2px;}

/* 灵感广场信息流 */
.insp-tabs{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;scrollbar-width:none;}
.insp-tabs::-webkit-scrollbar{display:none;}
.insp-tab{flex-shrink:0;padding:7px 16px;border-radius:20px;font-size:13px;font-weight:500;background:#fff;color:var(--text-secondary);border:1px solid rgba(195,177,225,.15);cursor:pointer;transition:all .15s;}
.insp-tab:active{transform:scale(.94);}
.insp-tab.active{background:linear-gradient(135deg,var(--peach),var(--lavender));color:#fff;border-color:transparent;}

.search-bar{margin:0 16px 12px;background:#fff;border-radius:var(--radius-md);padding:10px 14px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-card);cursor:pointer;}
.search-bar input{flex:1;border:none;outline:none;font-size:14px;background:transparent;color:var(--text-primary);}
.search-bar input::placeholder{color:var(--text-light);}
.search-bar .s-icon{font-size:16px;opacity:.5;}

.insp-feed{padding:0 16px;display:flex;flex-direction:column;gap:14px;}
.insp-card{background:#fff;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-card);transition:transform .15s;cursor:pointer;}
.insp-card:active{transform:scale(.98);}
.insp-cover{width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;font-size:48px;position:relative;}
.insp-cover.c1{background:linear-gradient(135deg,var(--peach-light),var(--peach));}
.insp-cover.c2{background:linear-gradient(135deg,var(--mist-blue-light),var(--mist-blue));}
.insp-cover.c3{background:linear-gradient(135deg,var(--lavender-light),var(--lavender));}
.insp-cover.c4{background:linear-gradient(135deg,#FFD9C4,var(--lavender));}
.insp-platform{position:absolute;top:10px;left:10px;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;color:#fff;background:rgba(0,0,0,.25);backdrop-filter:blur(10px);}
.insp-heat{position:absolute;bottom:10px;right:10px;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;color:#fff;background:rgba(0,0,0,.25);backdrop-filter:blur(10px);}
.insp-body{padding:12px 14px 14px;}
.insp-title{font-size:15px;font-weight:700;line-height:1.4;}
.insp-reason{font-size:13px;color:var(--text-secondary);margin-top:6px;line-height:1.5;background:var(--lavender-bg);padding:8px 10px;border-radius:10px;}
.insp-reason::before{content:'📝 ';}
.insp-actions{display:flex;gap:8px;margin-top:10px;}
.insp-btn{flex:1;padding:8px;border-radius:10px;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:transform .15s;}
.insp-btn:active{transform:scale(.95);}
.insp-btn-save{background:linear-gradient(135deg,var(--peach),var(--lavender));color:#fff;}
.insp-btn-detail{background:var(--cream);color:var(--text-secondary);}

/* 素材库 */
.material-toolbar{padding:12px 16px;display:flex;gap:8px;align-items:center;}
.material-search{flex:1;background:#fff;border-radius:var(--radius-md);padding:9px 14px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-card);}
.material-search input{flex:1;border:none;outline:none;font-size:14px;background:transparent;}
.material-filter-btn{width:40px;height:40px;border-radius:var(--radius-md);background:#fff;box-shadow:var(--shadow-card);border:none;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;}
.mat-tag{flex-shrink:0;padding:6px 14px;border-radius:16px;font-size:13px;font-weight:500;background:#fff;color:var(--text-secondary);border:1px solid rgba(195,177,225,.15);cursor:pointer;transition:all .15s;}
.mat-tag:active{transform:scale(.94);}
.mat-tag.active{background:var(--lavender);color:#fff;border-color:transparent;}
.material-collections{padding:0 16px 12px;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;}
.material-collections::-webkit-scrollbar{display:none;}
.collection-card{flex-shrink:0;width:120px;border-radius:var(--radius-md);padding:12px;background:linear-gradient(135deg,var(--lavender-light),var(--mist-blue-light));cursor:pointer;transition:transform .15s;}
.collection-card:active{transform:scale(.95);}
.collection-card.alt{background:linear-gradient(135deg,var(--peach-light),var(--lavender-light));}
.collection-card.alt2{background:linear-gradient(135deg,var(--mist-blue-light),var(--lavender-light));}
.collection-name{font-size:13px;font-weight:700;}
.collection-count{font-size:11px;color:var(--text-secondary);margin-top:4px;}

.waterfall{padding:0 12px;column-count:2;column-gap:10px;}
.wf-item{break-inside:avoid;margin-bottom:10px;border-radius:var(--radius-md);overflow:hidden;background:#fff;box-shadow:var(--shadow-card);cursor:pointer;transition:transform .15s;}
.wf-item:active{transform:scale(.97);}
.wf-thumb{width:100%;display:flex;align-items:center;justify-content:center;font-size:36px;position:relative;}
.wf-thumb.h1{height:140px;background:linear-gradient(135deg,var(--peach-light),var(--peach));}
.wf-thumb.h2{height:180px;background:linear-gradient(135deg,var(--mist-blue-light),var(--mist-blue));}
.wf-thumb.h3{height:110px;background:linear-gradient(135deg,var(--lavender-light),var(--lavender));}
.wf-thumb.h4{height:160px;background:linear-gradient(135deg,#FFD9C4,var(--lavender));}
.wf-type-badge{position:absolute;top:6px;right:6px;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;color:#fff;background:rgba(0,0,0,.3);backdrop-filter:blur(10px);}
.wf-info{padding:8px 10px 10px;}
.wf-title{font-size:12px;font-weight:600;line-height:1.3;}
.wf-tags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap;}
.wf-mini-tag{font-size:10px;padding:1px 7px;border-radius:8px;background:var(--lavender-bg);color:var(--lavender);}

/* FAB */
.fab{position:fixed;bottom:80px;right:16px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--peach),var(--lavender));border:4px solid var(--cream);box-shadow:var(--shadow-soft);display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;cursor:pointer;z-index:90;transition:transform .15s;}
.fab:active{transform:scale(.88);}

/* 笔记 */
.folder-chip{flex-shrink:0;padding:8px 16px;border-radius:14px;background:#fff;box-shadow:var(--shadow-card);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:transform .15s;}
.folder-chip:active{transform:scale(.94);}
.folder-chip.active{background:linear-gradient(135deg,var(--lavender),var(--mist-blue));color:#fff;}
.note-list{padding:0 16px;display:flex;flex-direction:column;gap:12px;}
.note-card{background:#fff;border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-card);cursor:pointer;transition:transform .15s;}
.note-card:active{transform:scale(.98);}
.note-card.short{border-left:3px solid var(--peach);}
.note-card.long{border-left:3px solid var(--mist-blue);}
.note-type{font-size:11px;font-weight:600;color:var(--text-light);margin-bottom:6px;}
.note-title{font-size:15px;font-weight:700;margin-bottom:6px;}
.note-preview{font-size:13px;color:var(--text-secondary);line-height:1.5;white-space:pre-wrap;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;}
.note-footer{display:flex;gap:8px;margin-top:10px;align-items:center;}
.note-date{font-size:11px;color:var(--text-light);flex:1;}

/* 阅读 */
.reading-stats{margin:0 16px 16px;background:linear-gradient(135deg,var(--lavender-light),var(--mist-blue-light));border-radius:var(--radius-lg);padding:18px;display:flex;align-items:center;gap:16px;}
.reading-stat-main{flex:1;}
.reading-stat-label{font-size:13px;color:var(--text-secondary);font-weight:500;}
.reading-stat-num{font-size:32px;font-weight:800;}
.reading-stat-unit{font-size:14px;font-weight:500;color:var(--text-secondary);}
.reading-stat-compare{text-align:center;padding-left:16px;border-left:1px solid rgba(255,255,255,.5);}
.reading-stat-compare .label{font-size:11px;color:var(--text-secondary);}
.reading-stat-compare .num{font-size:18px;font-weight:700;}
.reading-stat-trend{font-size:12px;font-weight:600;color:var(--green);margin-top:2px;}
.book-shelf{padding:0 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.book-card{cursor:pointer;transition:transform .15s;}
.book-card:active{transform:scale(.95);}
.book-cover{width:100%;aspect-ratio:3/4;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:var(--shadow-card);}
.book-info{margin-top:6px;}
.book-title{font-size:12px;font-weight:600;line-height:1.3;}
.book-author{font-size:10px;color:var(--text-light);margin-top:2px;}
.book-status{display:inline-block;margin-top:3px;font-size:9px;padding:1px 6px;border-radius:6px;font-weight:600;}
.status-reading{background:var(--peach-bg);color:#D4847A;}
.status-done{background:var(--green-bg);color:var(--green);}
.status-want{background:var(--lavender-bg);color:#9B7FC5;}

/* 弹层 */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(74,68,88,.5);z-index:300;opacity:0;pointer-events:none;transition:opacity .3s;display:flex;align-items:flex-end;justify-content:center;}
.modal-overlay.open{opacity:1;pointer-events:auto;}
.modal-sheet{background:var(--cream);border-radius:24px 24px 0 0;width:100%;max-width:430px;padding:20px 20px calc(30px + var(--safe-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.modal-overlay.open .modal-sheet{transform:translateY(0);}
.modal-handle{width:36px;height:4px;background:var(--lavender-light);border-radius:2px;margin:0 auto 16px;}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px;text-align:center;}
.save-source-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.source-option{background:#fff;border-radius:var(--radius-md);padding:18px 12px;text-align:center;cursor:pointer;transition:transform .15s;box-shadow:var(--shadow-card);}
.source-option:active{transform:scale(.95);}
.source-icon{font-size:32px;margin-bottom:6px;}
.source-label{font-size:13px;font-weight:600;}
.form-group{margin-bottom:14px;}
.form-label{font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;display:block;}
.form-input,.form-textarea{width:100%;background:#fff;border:1px solid rgba(195,177,225,.2);border-radius:var(--radius-sm);padding:12px 14px;font-size:14px;color:var(--text-primary);outline:none;font-family:inherit;transition:border .15s;}
.form-input:focus,.form-textarea:focus{border-color:var(--lavender);}
.form-textarea{min-height:70px;resize:none;}
.tag-input-area{background:#fff;border:1px solid rgba(195,177,225,.2);border-radius:var(--radius-sm);padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:46px;}
.tag-input-area input{flex:1;min-width:60px;border:none;outline:none;font-size:13px;background:transparent;}
.tag-pill{display:flex;align-items:center;gap:4px;padding:3px 10px;background:var(--lavender-bg);color:var(--lavender);border-radius:12px;font-size:12px;font-weight:500;}
.tag-pill .remove{cursor:pointer;font-size:14px;line-height:1;}
.btn-primary{width:100%;padding:14px;border-radius:var(--radius-md);background:linear-gradient(135deg,var(--peach),var(--lavender));color:#fff;font-size:15px;font-weight:700;border:none;cursor:pointer;transition:transform .15s;}
.btn-primary:active{transform:scale(.97);}
.btn-secondary{width:100%;padding:14px;border-radius:var(--radius-md);background:#fff;color:var(--text-secondary);font-size:15px;font-weight:600;border:1px solid rgba(195,177,225,.2);cursor:pointer;margin-top:8px;}
.btn-danger{width:100%;padding:14px;border-radius:var(--radius-md);background:#fff;color:#E07070;font-size:15px;font-weight:600;border:1px solid rgba(224,112,112,.2);cursor:pointer;margin-top:8px;}

/* 素材详情 */
.detail-cover{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:64px;}
.detail-section{padding:16px;background:#fff;border-radius:var(--radius-lg);margin:0 16px 12px;box-shadow:var(--shadow-card);}
.detail-label{font-size:12px;font-weight:600;color:var(--text-light);margin-bottom:8px;}
.detail-content{font-size:14px;color:var(--text-primary);line-height:1.6;white-space:pre-wrap;}
.bgm-player{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--lavender-bg),var(--mist-blue-bg));border-radius:var(--radius-md);padding:12px 14px;}
.bgm-cover{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--lavender),var(--mist-blue));display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.bgm-info{flex:1;min-width:0;}
.bgm-title{font-size:14px;font-weight:600;}
.bgm-source{font-size:12px;color:var(--text-secondary);margin-top:2px;}
.bgm-play{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;flex-shrink:0;box-shadow:var(--shadow-card);transition:transform .15s;}
.bgm-play:active{transform:scale(.88);}
.link-jump-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;background:var(--mist-blue-bg);border-radius:var(--radius-sm);font-size:14px;font-weight:600;color:#6B9BB5;cursor:pointer;}

/* 筛选chip */
.filter-chip{flex-shrink:0;padding:6px 14px;border-radius:16px;font-size:12px;font-weight:600;background:#fff;color:var(--text-secondary);border:1px solid rgba(195,177,225,.15);cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .15s;}
.filter-chip:active{transform:scale(.94);}
.filter-chip.active{background:var(--lavender-bg);color:var(--lavender);border-color:var(--lavender);}

/* 待办 */
.todo-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fff;border-radius:var(--radius-md);margin-bottom:8px;box-shadow:var(--shadow-card);cursor:pointer;transition:transform .15s;}
.todo-item:active{transform:scale(.98);}
.todo-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--lavender-light);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;}
.todo-check.done{background:var(--lavender);border-color:var(--lavender);color:#fff;font-size:12px;}
.todo-text{flex:1;font-size:14px;font-weight:500;}
.todo-item.done .todo-text{color:var(--text-light);text-decoration:line-through;}
.todo-time{font-size:12px;color:var(--text-light);}

/* 日程 */
.schedule-item{display:flex;gap:12px;padding:0 16px;margin-bottom:12px;}
.schedule-time{width:50px;text-align:right;font-size:13px;font-weight:700;color:var(--text-secondary);padding-top:2px;flex-shrink:0;}
.schedule-card{flex:1;background:#fff;border-radius:var(--radius-md);padding:12px 14px;box-shadow:var(--shadow-card);border-left:3px solid var(--peach);}
.schedule-card.blue{border-left-color:var(--mist-blue);}
.schedule-card.lavender{border-left-color:var(--lavender);}
.schedule-title{font-size:14px;font-weight:600;}
.schedule-desc{font-size:12px;color:var(--text-secondary);margin-top:4px;}

/* 编辑器 */
.editor-bar{position:sticky;top:0;z-index:100;background:rgba(253,251,249,.92);backdrop-filter:blur(20px);padding:calc(12px + var(--safe-top)) 16px 12px;display:flex;align-items:center;gap:12px;border-bottom:.5px solid rgba(195,177,225,.1);}
.editor-title-input{flex:1;font-size:18px;font-weight:700;border:none;outline:none;background:transparent;color:var(--text-primary);}
.editor-body{padding:16px;}
.editor-content-input{width:100%;min-height:300px;border:none;outline:none;font-size:15px;line-height:1.7;color:var(--text-primary);background:transparent;font-family:inherit;resize:none;}

/* 空状态 */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-light);}
.empty-state-icon{font-size:48px;margin-bottom:12px;}
.empty-state-text{font-size:14px;}

/* Toast */
.toast{position:fixed;top:calc(60px + var(--safe-top));left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(74,68,88,.9);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:all .3s;pointer-events:none;max-width:90%;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* 安装引导 */
.install-banner{position:fixed;bottom:90px;left:16px;right:16px;max-width:398px;margin:0 auto;background:linear-gradient(135deg,var(--peach),var(--lavender));border-radius:var(--radius-lg);padding:14px 16px;display:flex;align-items:center;gap:12px;z-index:95;box-shadow:var(--shadow-soft);transition:transform .3s,opacity .3s;}
.install-banner.hide{transform:translateY(100px);opacity:0;pointer-events:none;}
.install-banner-text{flex:1;color:#fff;}
.install-banner-title{font-size:14px;font-weight:700;}
.install-banner-sub{font-size:12px;opacity:.9;margin-top:2px;}
.install-banner-btn{padding:8px 16px;background:#fff;color:var(--lavender);border-radius:10px;font-size:13px;font-weight:700;border:none;cursor:pointer;}
.install-banner-close{color:#fff;font-size:20px;cursor:pointer;opacity:.7;}
</style>
</head>
<body>

<!-- 左侧抽屉 -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div class="drawer-avatar">创</div>
    <div class="drawer-name">创作者工作台</div>
    <div class="drawer-sub">你的私人灵感助手</div>
  </div>
  <div class="drawer-section-label">核心功能</div>
  <div class="drawer-item active" data-page="home"><div class="drawer-icon" style="background:var(--peach-bg)">🏠</div><div class="drawer-label">主页</div></div>
  <div class="drawer-item" data-page="inspiration"><div class="drawer-icon" style="background:var(--mist-blue-bg)">✨</div><div class="drawer-label">灵感广场</div></div>
  <div class="drawer-item" data-page="material"><div class="drawer-icon" style="background:var(--lavender-bg)">📦</div><div class="drawer-label">素材库</div></div>
  <div class="drawer-item" data-page="note"><div class="drawer-icon" style="background:var(--peach-bg)">📝</div><div class="drawer-label">笔记 / 灵感记录</div></div>
  <div class="drawer-item" data-page="reading"><div class="drawer-icon" style="background:var(--mist-blue-bg)">📚</div><div class="drawer-label">阅读记录</div></div>
  <div class="drawer-section-label">辅助功能</div>
  <div class="drawer-item" data-page="todo"><div class="drawer-icon" style="background:var(--lavender-bg)">☑️</div><div class="drawer-label">待办事项</div></div>
  <div class="drawer-item" data-page="schedule"><div class="drawer-icon" style="background:var(--peach-bg)">📅</div><div class="drawer-label">日程安排</div></div>
  <div class="drawer-section-label">其他</div>
  <div class="drawer-item" data-page="settings"><div class="drawer-icon" style="background:var(--mist-blue-bg)">⚙️</div><div class="drawer-label">设置</div></div>
</div>

<!-- 页面容器（由JS动态渲染） -->
<div id="app"></div>

<!-- 底部导航 -->
<div class="bottom-nav" id="bottomNav">
  <div class="nav-item active" data-page="home"><div class="nav-icon">🏠</div><div class="nav-label">主页</div></div>
  <div class="nav-item" data-page="inspiration"><div class="nav-icon">✨</div><div class="nav-label">灵感</div></div>
  <div class="nav-item" data-page="material"><div class="nav-icon">📦</div><div class="nav-label">素材</div></div>

  <div class="nav-item" data-page="reading"><div class="nav-icon">📚</div><div class="nav-label">阅读</div></div>
</div>

<!-- 弹层容器（由JS动态渲染） -->
<div id="modalContainer"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- 安装引导 -->
<div class="install-banner hide" id="installBanner">
  <div class="install-banner-text">
    <div class="install-banner-title">添加到主屏幕</div>
    <div class="install-banner-sub">像App一样使用，全屏体验更佳</div>
  </div>
  <button class="install-banner-btn" id="installBtn">安装</button>
  <span class="install-banner-close" id="installClose">×</span>
</div>

<script src="db.js"></script>
<script src="app.js"></script>
